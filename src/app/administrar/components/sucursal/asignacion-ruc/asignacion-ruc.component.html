<div id="mymodalasignacionruc" class="modal fade" role="dialog" data-backdrop="false">
    <div class="modal-dialog modal-lg">
      <!-- Modal content -->
      <div class="modal-content">
        <div class="modal-header">
        <h5 class="modal-title">SUCURSAL {{ sucursal }}</h5>
      <button type="button" class="close" data-dismiss="modal" aria-label="Close">
            <span aria-hidden="true">×</span>
            </button>
        </div>
        <div class="modal-body">

            <div class="row">
                
              <div class="col-md-12">

                    <div class="row">
                
                      <div class="col-md-12">


                            <div class="form-group">
                                <label>Ruc Empresa:</label>
                                <select (change)="changeEmpresa($event)" class="form-control form-control-sm">
                                    <option value="{{item.cod_ruc}}" *ngFor="let item of datosruc" [selected]="this.cod_ruc == item.cod_ruc">
                                        {{item.empresa}}
                                    </option>
                                </select>
                            </div>	

                      </div>

                      <div class="col-md-12">
                        
                          <!-- <div class="form-group">
                              <label>Caducidad Certificado:</label>
                              <label class="form-control form-control-sm">{{ fecha_caducidad_firma }}</label>
                          </div> -->

                          <div class="d-flex justify-content-end align-items-center">
                            <button (click)="guardarAsignacion()" class="btn btn-primary btn-sm" type="button"><i class="fas fa-save"></i> Guardar</button>
                        </div>

                      </div>

                    </div>
                
                    

                  
              </div>

            </div>

            <div class="table-responsive p-0 pt-2">
                <table class="design-table resp">
                <thead>
                    <tr>
                        <th>EMPRESA</th>
                        <th>RUC</th>
                        <th>RAZÓN SOCIAL</th>
                        <th>ASIGNAR</th>
                        <th></th>
                    </tr>
                </thead>
                <tbody>
                    <tr *ngFor="let item of datosrucempresa">
                        <td>
                            <div>{{item.empresa}}</div>
                        </td>
                        <td>
                            <div><small class="badge badge-primary">{{item.tipo_ruc}}</small></div>
                            <div>{{item.ruc_sucursal}}</div>
                        </td>
                        <td>
                            <div><small class="badge badge-info">{{item.razonsocial}}</small></div>
                            {{item.nombrecomercial}}
                        </td>
                        <td>
                            <small *ngIf="item.asignacion==1" class="badge badge-primary">FIJO</small>
                            <small *ngIf="item.asignacion!=1" class="badge badge-secondary">NO</small>
                        </td>
                        <td>
                            <div class="d-flex justify-content-end">
                                <button (click)="asignarRucFijo(item.id_sucursal_ruc_empresa, item.cod_ruc);" class="btn btn-outline-primary btn-sm" type="button"><i class="fas fa-thumbtack"></i></button>
                                <button (click)="eliminarAsignacion(item.id_sucursal_ruc_empresa);" class="btn btn-outline-danger btn-sm" type="button"><i class="fas fa-trash"></i></button>
                            </div>
                        </td>
                    </tr>
                </tbody>
                </table>
            </div>


            <div class="d-flex justify-content-end align-items-center">
              <button class="btn btn-secondary btn-sm" type="button" data-dismiss="modal"><i class="fas fa-times-circle"></i> Cerrar</button>
            </div>
  
        </div>
        
      </div>
  
    </div>
</div>
