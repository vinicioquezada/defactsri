<div id="mymodalconfiguracionservicio" class="modal fade" role="dialog" data-backdrop="false">
    <div class="modal-dialog">
      <!-- Modal content -->
      <div class="modal-content">
        <div class="modal-header">
        <h5 class="modal-title">CONFIGURACIÓN SERVICIO</h5>
      <button type="button" class="close" data-dismiss="modal" aria-label="Close">
            <span aria-hidden="true">×</span>
            </button>
        </div>
        <div class="modal-body">

            <div class="row">
                
              <div class="col-md-12">

                    <div class="row">
                
                      <div class="col-md-12">
                          
                          <div class="form-group">
                              <label>Codigo Proyecto:</label>
                              <input [(ngModel)]="cod_proyecto" class="form-control form-control-sm" placeholder="" type="text">
                          </div>

                          <div class="form-group">
                            <div class="custom-control custom-switch">
                                <input [checked]="multisucursal" (change)="changeChkMultiSucursal()" type="checkbox" class="custom-control-input" id="customSwitch1">
                                <label class="custom-control-label" for="customSwitch1">Multi Sucursales</label>
                            </div>
                          </div>

                          <div class="form-group">
                              <label>Url Proyecto:</label>
                              <input [(ngModel)]="urlproyecto" class="form-control form-control-sm" placeholder="" type="text">
                          </div>
                          
                      </div>

                      

                     

                    </div>
                


                    



                  
              </div>

            </div>


            <div class="d-flex justify-content-end align-items-center">
              <button (click)="actualizar();" class="btn btn-warning btn-sm mr-1" type="button"><i class="fas fa-save"></i> Actualizar</button>
              <button class="btn btn-secondary btn-sm" type="button" data-dismiss="modal"><i class="fas fa-times-circle"></i> Cerrar</button>
            </div>
  
        </div>
        
      </div>
  
    </div>
</div>
