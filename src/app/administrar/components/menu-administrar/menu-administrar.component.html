<section class="content-header">

  <div class="container-fluid">

      <div *ngIf="permisosProcesosOperativos()" class="card card-outline card-primary">
        <div class="card-header">
          <h3 class="card-title"><i class="fas fa-cash-register mr-2"></i> Procesos Operativos</h3>
        </div>
        <div class="card-body">
          
          <div class="row">

            <div class="col-md-6 col-lg-2 col-xlg-3" *ngIf="this.opcionesmenu['roles']">
              <a routerLink="/menuadministrar/roles" class="small-box-footer">
                <div class="card bg-cyan card-menu">
                  <h1>
                    <i class="fas fa-users-cog"></i>
                  </h1>
                  <span class="text-white h6">Roles</span>
                </div>
              </a>
            </div>

            <div class="col-md-6 col-lg-2 col-xlg-3" *ngIf="this.opcionesmenu['usuarios']">
              <a routerLink="/menuadministrar/usuario" class="small-box-footer">
                <div class="card bg-cyan card-menu">
                  <h1>
                    <i class="fas fa-users"></i>
                  </h1>
                  <span class="text-white h6">Usuario</span>
                </div>
              </a>
            </div>

          </div>
          

        </div>
      </div>

      <div *ngIf="permisosConfiguracionAuxiliares()" class="card card-outline card-secondary mt-3">
        <div class="card-header">
          <h3 class="card-title"><i class="fas fa-tools mr-2"></i> Configuración y Auxiliares</h3>
        </div>
        <div class="card-body">

          <div class="row">

            <div *ngIf="this.opcionesmenu['configuracionimpresion']" class="col-lg-2 col-md-3 col-12 mb-2 d-flex">
              <a routerLink="/menuadministrar/configuracionimpresion" class="btn btn-block btn-outline-secondary btn-sm h-100 d-flex align-items-center justify-content-center">
              <span>
                <i class="fas fa-print"></i> Impresión
              </span></a>
            </div>

            <div *ngIf="this.status" class="col-lg-2 col-md-3 col-12 mb-2 d-flex">
              <a routerLink="/menuadministrar/ruc" class="btn btn-block btn-outline-secondary btn-sm h-100 d-flex align-items-center justify-content-center">
              <span>
                <i class="fas fa-id-card"></i> Ruc
              </span></a>
            </div>

            <div *ngIf="this.status" class="col-lg-2 col-md-3 col-12 mb-2 d-flex">
              <a routerLink="/menuadministrar/sucursal" class="btn btn-block btn-outline-secondary btn-sm h-100 d-flex align-items-center justify-content-center">
              <span>
                <i class="fas fa-university"></i> Sucursales
              </span></a>
            </div>


          </div>
          
        </div>
      </div>

  </div>
</section>
