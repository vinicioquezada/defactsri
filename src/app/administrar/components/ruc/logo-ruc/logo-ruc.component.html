<div id="mymodallogo" class="modal fade" role="dialog" data-backdrop="false">
    <div class="modal-dialog">
      <!-- Modal content -->
      <div class="modal-content">
        <div class="modal-header">
        <h5 class="modal-title">LOGO {{ empresa }}</h5>
      <button type="button" class="close" data-dismiss="modal" aria-label="Close">
            <span aria-hidden="true">×</span>
            </button>
        </div>
        <div class="modal-body">

            <div class="row">
                
              <div class="col-md-12">

                <div class="row">
                    <button 
                        *ngIf="selectedLogoFile" 
                        (click)="clearLogo()" 
                        class="btn btn-danger btn-sm">
                        <i class="fa fa-trash"></i> Borrar
                    </button>
                    </div>

                    <div class="row pt-1">
                    <div class="justify-content-center text-center m-auto">

                        <div *ngIf="selectedLogoFile" class="alert alert-info">
                        <i class="fa fa-file-image"></i>
                        {{ selectedLogoFile.name }}
                        <br>
                        Tamaño: {{ (selectedLogoFile.size / 1024).toFixed(2) }} KB
                        </div>

                        <!-- Vista previa -->
                        <img
                        *ngIf="selectedLogoBase64"
                        [src]="selectedLogoBase64"
                        class="img-fluid mt-2"
                        style="max-height: 150px;"
                        />

                    </div>
                    </div>

                    <div class="row pt-1">
                    <div class="drag-drop">

                        <input 
                        type="file"
                        accept=".png,image/png"
                        (change)="onLogoSelected($event)"
                        #fileLogo
                        />

                        <span class="fa-stack fa-2x">
                        <i class="fa fa-cloud fa-stack-2x bottom pulsating"></i>
                        <i class="fa fa-circle fa-stack-1x top medium"></i>
                        <i class="fa fa-arrow-circle-up fa-stack-1x top"></i>
                        </span>

                        <span class="desc">Añadir Logo PNG</span>

                    </div>
                    </div>
                  
              </div>


            </div>



            <div class="d-flex justify-content-end align-items-center">
              <button (click)="clickSubir();" class="btn btn-primary btn-sm mr-1" type="button"><i class="fas fa-upload"></i> Subir</button>
              <button class="btn btn-secondary btn-sm" type="button" data-dismiss="modal"><i class="fas fa-times-circle"></i> Cerrar</button>
            </div>
  
        </div>
        
      </div>
  
    </div>
</div>
