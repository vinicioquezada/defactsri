<div id="mymodalsecuenciasfactura" class="modal fade" role="dialog" data-backdrop="false">
    <div class="modal-dialog">
      <!-- Modal content -->
      <div class="modal-content">
        <div class="modal-header">
        <h5 class="modal-title">FIRMA {{ empresa }} | SERIE ESTAB {{ serieestab }} | PUNTO EMI {{ ptoemi }}</h5>
      <button type="button" class="close" data-dismiss="modal" aria-label="Close">
            <span aria-hidden="true">×</span>
            </button>
        </div>
        <div class="modal-body">

            <div class="row">
                
              <div class="col-md-12">

                    <div class="row">
                
                      <div class="col-md-12">
                          
                        <div class="table-responsive p-0">

                            <table class="design-table resp">
                                <thead>
                                <tr>
                                    <th width="100px">TIPO VENTA</th>
                                    <th width="100px">ÚLTIMO NÚMERO</th>
                                    <th width="50px"></th>
                                </tr>
                                </thead>
                                <tbody>
                                <tr *ngFor="let item of datossecuenciasfactura">
                                    <td>
                                        <span class="form-control form-control-sm">{{ item.tipo_venta }}</span>
                                    </td>
                                    <td>
                                        <input [(ngModel)]="item.ultimo_numero" class="form-control form-control-sm" maxlength="15" placeholder="" type="text">
                                    </td>
                                    <td>
                                        <div class="d-flex justify-content-end">
                                          <button (click)="actualizarSecuanciaFactura(item)" data-bs-toggle="tooltip" data-bs-placement="top" title="ACTUALIZAR NUMERACIÓN" class="btn btn-outline-warning btn-sm" type="button"><i class="fas fa-save"></i></button>
                                        </div>
                                    </td>
                                </tr>
                                </tbody>
                            </table>
                            
                        </div>
                          
                          
                      </div>

              

                    </div>
                
  


                  
              </div>

            </div>



            <div class="d-flex justify-content-end align-items-center">
              <button *ngIf="datossecuenciasfactura.length==0" (click)="clickGenerarSecuencias()" class="btn btn-primary btn-sm mr-1" type="button"><i class="fas fa-sort-numeric-up"></i> Generar</button>
              <button class="btn btn-secondary btn-sm" type="button" data-dismiss="modal"><i class="fas fa-times-circle"></i> Cerrar</button>
            </div>
  
        </div>
        
      </div>
  
    </div>
</div>
