<app-registro-abono-venta [importetotal] = "importetotal" (sendAceptar)="sendAceptar($event)"></app-registro-abono-venta>


         
<app-proveedor-form (datosenvio)="recibirDatosNuevoProveedor($event)" (datosenvioexistente)="recibirDatosProveedorExistente($event)"></app-proveedor-form>
  
        

<app-listado-proveedor (datosenviar)="recibirDatosProveedor($event)"></app-listado-proveedor>

<div id="mymodallistarproductos" class="modal fade" role="dialog" data-backdrop="false">
    <div class="modal-dialog modal-xl">
      <!-- Modal content -->
      <div class="modal-content">
        <div class="modal-header">
        <h5 class="modal-title">LISTADO DE PRODUCTOS</h5>
      <button type="button" class="close" data-dismiss="modal" aria-label="Close">
            <span aria-hidden="true">×</span>
            </button>
        </div>
        <div class="modal-body">
            <app-listado-producto-compras (datosenviar)="recibirDatosProducto($event)"></app-listado-producto-compras>
            <div class="d-flex justify-content-end align-items-center">
                <button (click)="actualizarListadoProducto();" type="button" class="btn btn-primary btn-sm" data-dismiss="modal"><i class="fas fa-sync-alt"></i> Actualizar</button>&nbsp;
            <button class="btn btn-secondary btn-sm" type="button" data-dismiss="modal"><i class="fas fa-times-circle"></i> Cerrar</button>
            </div>
        </div>

 

      </div>
  
    </div>
</div>

<section class="content-header" id="box">
    <div class="container-fluid">
      <div class="row mb-2">
        <div class="col-sm-9">
            <div class="btn-toolbar" role="toolbar">
              <div class="btn-group">
                <button *ngIf="tipo_formulario=='nuevoregistro' || tipo_formulario=='nuevoregistrogastos'" (click)="clickNuevo();" [disabled]="disabledbtnnuevo" class="btn btn-secondary btn-flat btn-sm" type="button"><i class="fas fa-file"></i> Nuevo</button>
                <button *ngIf="tipo_formulario=='actualizarregistro' || tipo_formulario=='actualizarregistrogastos'" (click)="clickModificar();" [disabled]="disabledbtnmodificar" class="btn btn-secondary btn-flat btn-sm" type="button"><i class="fas fa-edit"></i> Modificar</button>
                  <button (click)="visualizar();" [disabled]="disabledbtnimprimir" class="btn btn-primary btn-flat btn-sm" type="button"><i class="fas fa-print"></i> Imprimir</button>
                  <button (click)="clickDeshacer();" class="btn btn-secondary btn-flat btn-sm" type="button"><i class="fas fa-redo-alt"></i> Deshacer</button>
                  <button (click)="goBack();" class="btn btn-secondary btn-flat btn-sm" type="button"><i class="fa fa-reply"></i> Atrás</button>
              </div>

                <!--INICIA MULTIEMPRESA-->
                <!--INICIA MULTIEMPRESA-->
                <!--INICIA MULTIEMPRESA-->
                <div *ngIf="multisucursal=='1'" class="input-group">  
                    <label class="form-control form-control-sm">{{sucursal}}</label>
                </div>
                <!--TERMINA MULTIEMPRESA-->
                <!--TERMINA MULTIEMPRESA-->
                <!--TERMINA MULTIEMPRESA-->
            </div>


        </div>

        <div class="col-sm-3">

            <div>
                <div class="input-group input-group-sm">
                    <div class="input-group-prepend">
                    <span class="input-group-text"><i class="fas fa-paperclip"></i>&nbsp;Nº Factura:</span>
                    </div>
                    <label class="form-control">{{this.numero_factura}}</label>
                </div>
            </div>
     
        </div>
        
      </div>
      
    </div><!-- /.container-fluid -->

    
</section>

<!-- Main content -->
<section class="content">
    <div class="container-fluid">

        <div *ngIf="loadingprincipal" class="row pb-2">
            <div class="justify-content-center text-center m-auto">
                <div class="spinner-border text-primary" style="width: 3rem; height: 3rem;"></div>
            </div>
        </div>

        <div class="row">
            <div class="col-md-4">
              <div class="form-group">
                <div class="input-group input-group-sm">
                    <div class="input-group-prepend">
                    <span class="input-group-text"><i class="fas fa-calendar"></i>&nbsp;Fecha:</span>
                    </div>
                    <label class="form-control">{{fecha_hora}}</label>
                </div>
              </div>
            </div>
      
            <div class="col-md-8">
      
              <div class="form-group">
                <div class="input-group input-group-sm">
                    <div class="input-group-prepend">
                        <span class="input-group-text"><i class="fas fa-key"></i>&nbsp;Clave:</span>
                    </div>
                    <input [(ngModel)]="claveacceso" (keyup.enter)="buscarCompraPorClaveAcceso();" class="form-control" maxlength="50" [disabled]="disabledtxtcodigobarra" placeholder="Ingrese Clave"type="text">
                    <span class="input-group-append">
                        <button (click)="buscarCompraPorClaveAcceso();" [disabled]="disabledtxtcodigobarra" class="btn btn-primary btn-flat" type="button"><i class="fa fa-search"></i></button>
                    </span>
                </div>
              </div>

            </div>
        </div>

      <div class="row">
          <div class="col-md-12">

                  <div class="card card-cyan card-outline">
                      <div class="card-header">

                        <div style="text-align:center">
                            <div *ngIf="loading" class="spinner-border text-primary" style="width: 3rem; height: 3rem;"></div>
                        </div>

                          <button (click)="clickListarProveedor();" [disabled]="disabledbtnlistarproveedor" type="button" class="btn btn-primary btn-flat btn-xs float-right"> <span class="fa fa-list"></span> </button>
                          <button (click)="clickNuevoProveedor();" [disabled]="disabledbtnagregarproveedor" type="button" class="btn btn-primary btn-flat btn-xs float-right"> <span class="fa fa-plus"></span> </button>

                          <h5 style="font-size: 14px">
                                  <i class="fa fa-user-circle" aria-hidden="true"></i>&nbsp;<label>{{ this.proveedor }}</label>
                                  &nbsp;&nbsp;&nbsp;
                                  <i class="fa fa-id-card" aria-hidden="true"></i>&nbsp;<label>{{ this.numero_identificacion }}</label><br>
                                  <i class="fas fa-mobile" aria-hidden="true"></i>&nbsp;
                                  <label id="lblcelular">{{ this.celular }}</label>
                                  &nbsp;&nbsp;&nbsp;
                                  <i class="fa fa-envelope" aria-hidden="true"></i>&nbsp;<label>{{ this.correo }}</label>
                          </h5>

                      </div> 
                  </div>


                 

                    <div class="card card-cyan card-outline">
                        <div class="card-header">
                            <div *ngIf="textomensaje != ''" style='text-align: center;'>
                                  <label style='font-size:30px;' [ngStyle]="{'color':colormensaje}">{{textomensaje}}</label>
                            </div>

                            <div class="row">			 
                                    <div class="col-md-6" style="font-size: 14px">

                                            <div class="form-group row">
                                                <label class="col-sm-4 col-form-label">Tipo Compra:</label>
                                                <div class="col-sm-8">
                                                    <div class="input-group input-group-sm">
                                                        <div class="input-group-prepend">
                                                            <span class="input-group-text"><i class="fas fa-shopping-cart"></i></span>
                                                        </div>
                                                        <label class="d-none"></label>
                                                        <select [(ngModel)]="this.tipo_compra" (change)="changeTipoCompra($event)" class="form-control" [disabled]="disabledcmbtipocompra" >
                                                        <option value='FACTURA'>FACTURA</option>
                                                        <option value="RECIBO">RECIBO</option>
                                                        </select>
                                                    </div>
                                                </div>
                                            </div>

                                            

                                            <div class="form-group row">
                                                <label class="col-sm-4 col-form-label">Fecha Compra Proveedor:</label>
                                                <div class="col-sm-8">
                                                    <div class="input-group input-group-sm">
                                                        <div class="input-group-prepend">
                                                        <span class="input-group-text"><i class="fas fa-calendar"></i></span>
                                                        </div>
                                                        <input [(ngModel)]="fecha_registro" class="form-control" [disabled]="disabledtxtfecha" type="date">
                                                    </div>
                                                </div>
                                            </div>

                                            
                                    </div>
                                    <div class="col-md-6" style="font-size: 14px">
                                        <div class="form-group row">
                                            <label class="col-sm-4 col-form-label">Nº Fact. Compra Proveedor:</label>
                                            <div class="col-sm-8">
                                                <div class="form-group">
                                                    <input [(ngModel)]="this.numerocompraproveedor" [disabled]="disabledtxtnmerocompraproveedor" maxlength="15" class="form-control form-control-sm" type="text">
                                                </div>
                                            </div>
                                        </div>

                                        <app-forma-pago [disabledformapago] = "disabledformapago" [chkcontado] = "chkcontado"></app-forma-pago>

                                        <div class="form-group">
                                            <div class="custom-control custom-switch custom-switch-off-secondary custom-switch-on-success">
                                            <input (change)="changeChkContado();" [checked]="chkcontado" [disabled]="disabledchkcontado" type="checkbox" class="custom-control-input" id="customSwitch3">
                                            <label class="custom-control-label" for="customSwitch3">Compra al Contado</label>
                                            </div>
                                        </div>
                                    </div>

                                
                            </div>
                        </div>
                    </div>

                


                <div *ngIf="inventario==1" class="form-group">
                    <label>Código Barra:</label>
                    
                    
                    <div class="input-group input-group-sm">
                        <div class="input-group-prepend">
                            <span class="input-group-text"><i class="fas fa-barcode"></i></span>
                            <!-- <span class="input-group-text"><input (change)="changeChkImpuesto();" [checked]="chkimpuesto" [disabled]="disabledchkimpuesto" type="checkbox">IMP.</span> -->
                        </div>
                        <input id="txtcodigo" [(ngModel)]="codigo_barra" oninput="javascript:this.value=this.value.toUpperCase();" (keyup.enter)="buscarCodigoProducto();" class="form-control" maxlength="35" [disabled]="disabledtxtcodigobarra" placeholder="Ingrese Código de Barra"type="text">
                        <span class="input-group-append">
                            <button (click)="clickListarProductos();" [disabled]="disabledbtnlistarproducto" class="btn btn-primary btn-flat" type="button"><i class="fa fa-list"></i></button>
                        </span>
                    </div>
                </div>

                <div *ngIf="inventario==0" class="row justify-content-end pb-2">
                    <div class="col-md-3">
                        <div class="form-group">
                            <button (click)="clickAgregarSinIva();" [disabled]="disabledbtnagregarproveedor" type="button" class="btn btn-warning btn-flat btn-xs float-right"> <i class="fas fa-dollar-sign"></i> S Iva</button>
                            <button (click)="clickAgregarConIva();;" [disabled]="disabledbtnagregarproveedor" type="button" class="btn btn-primary btn-flat btn-xs float-right"> <i class="fas fa-dollar-sign"></i> + Iva</button>
                        </div>
                    </div>
                </div>
                
                  <app-detalle-compra [inventario]="inventario" (datosenviar)="recibirDatosDetalles($event)"></app-detalle-compra>
                  

                  <div style="text-align:center">
                    <div *ngIf="loadingalmacenar" class="spinner-border text-primary" style="width: 3rem; height: 3rem;"></div>
                  </div>

                  <div class="d-flex justify-content-end align-items-center">

                    <button *ngIf="deudor==1 && (tipo_formulario=='nuevoregistro' || tipo_formulario=='nuevoregistrogastos')" (click)="clickAbonar()" class="btn btn-primary btn-sm" type="button"><i class="fas fa-hand-holding-usd"></i>
                        Abonar
                        <span class="badge badge-success">
                          {{ this.recibidoabono }}
                        </span>
                      </button>&nbsp;

                    <button *ngIf="tipo_formulario=='nuevoregistro' || tipo_formulario=='nuevoregistrogastos'" (click)="clickVerificar();" [disabled]="disabledbtnguardar" class="btn btn-primary btn-sm" type="button"><i class="fas fa-save"></i>
                        Guardar
                        <span *ngIf="deudor==1" class="badge badge-warning">
                          Por Cobrar
                        </span>
                    </button>&nbsp;

                    <button *ngIf="(tipo_formulario=='actualizarregistro' && kardex == '0') || tipo_formulario=='actualizarregistrogastos'" (click)="clickVerificar();" [disabled]="disabledbtnactualizar" class="btn btn-warning btn-sm" type="button"><i class="fas fa-save"></i> Actualizar</button>

                    <div *ngIf="tipo_formulario=='actualizarregistro' && kardex == '1'" class="form-group">
                        <button (click)="clickVerificarEncabezado();" [disabled]="disabledbtnactualizar" class="btn btn-warning btn-block btn-sm" type="button"><i class="fas fa-save"></i> Actualizar Encabezado</button>
                    </div>

                  </div>
          </div>

          
      </div>		


       

      
  

      


    </div>
</section>
