<div id="mymodalcodigobarra" class="modal fade" role="dialog" data-backdrop="false">
  <div class="modal-dialog">
    <!-- Modal content -->
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">PRODUCTO: - {{ descripcion }}</h5>
          <button type="button" class="close" data-dismiss="modal" aria-label="Close">
          <span aria-hidden="true">×</span>
          </button>
      </div>
      <div class="modal-body">


        
        <div class="row justify-content-between">

          <span *ngIf="loadinglistado" class="justify-content-center text-center m-auto">
                <div class="spinner-border text-primary" style="width: 3rem; height: 3rem;"></div>
          </span>

        </div>

          <div class="row">
              <button (click)="generarcodigobarra();" class="btn btn-primary btn-flat btn-sm" type="button"><i class="fas fa-barcode"></i> Generar</button>
              <button (click)="exportarcodigos();" class="btn btn-danger btn-flat btn-sm" type="button"><i class="fa fa-file-pdf"></i> Exportar</button>
              <!-- <button id="btnagregarcodigos" class="btn btn-success btn-flat btn-sm" type="button"><i class="fa fa-plus"></i> Agregar</button> -->

              <div class="col-md-12">
                <div class="form-group">
                  <label>Cantidad Códigos Generar:</label>
                  <div class="input-group input-group-sm">
                        <div class="input-group-prepend">
                          <span class="input-group-text"><i class="fas fa-sort-amount-up"></i></span>
                        </div>
                        <input class="form-control" onKeyPress="return soloNumerosEnteros(event)" [(ngModel)]="cantidadcodigosbarra" maxlength="30" placeholder="Cantidad Códigos Generar" type="text">
                  </div>
                </div>
              </div>
          </div>
        
          <div id="cargagenerar">
            <div style="text-align: center;">
              <img [src]="ruta_imagen" width="300px" height="150px">
            </div>
          </div>
          
          <div class="d-flex justify-content-end align-items-center">
            <button class="btn btn-secondary btn-sm" type="button" data-dismiss="modal"><i class="fas fa-times-circle"></i> Cerrar</button>
          </div>

      </div>

      

  </div>
</div>
</div>

<section class="content-header">
    <div class="container-fluid">
      <div class="row mb-2">
        <div class="col-sm-12">
            <div class="btn-toolbar" role="toolbar">
              <div class="btn-group">
                <button (click)="clickDeshacer();" class="btn btn-secondary btn-flat btn-sm float-right" type="button"><i class="fas fa-redo-alt"></i> Deshacer</button>
                <button routerLink="/menualmacen" class="btn btn-secondary btn-flat btn-sm" type="button"><i class="fas fa-undo"></i> Atrás</button>
              </div>
            </div>
        </div>
        
      </div>
      
    </div><!-- /.container-fluid -->
  </section>
  
  <!-- Main content -->
<section class="content">
    <div class="container-fluid">
      <div class="row">
  
        <div class="col-md-12">

          <div class="row">

            <div class="col-md-6">
              <div class="form-group">
                <label>Categoría: </label>
                <select (change)="onchangecategoria($event)" class="form-control form-control-sm">
                    <option value="">TODAS</option>
                    <option value="{{item.cod_categoria}}" *ngFor="let item of datoscategoria" [selected]="categoria == item.categoria">
                        {{item.categoria}}
                </option>
                </select>
              </div>
            </div>

            <div class="col-md-6">
              <label>SubCategoria:</label>
              <div class="input-group input-group-sm">
                <ng-select class="form-control form-control-sm" [(ngModel)]="cod_subcategoria">
                  <ng-option *ngFor="let item of datossubcategoria" [value]="item.cod_subcategoria">{{item.subcategoria}}</ng-option>
                </ng-select>
                <span class="input-group-append">
                  <button (click)="buscarproductos();" class="btn btn-primary btn-flat" type="button"><i class="fa fa-search"></i></button>
                </span>
              </div>
            </div>

          </div>
          
        <!-- /.Inicia form1 -->
        <!-- /.Inicia form1 -->
        <!-- /.Inicia form1 -->
          <div class="card card-primary card-outline">
            <div class="card-header">
              <h3 class="card-title"><i class="fa fa-file-alt"></i> Explorador</h3>
  
  
              <div class="card-tools">
                <div class="input-group input-group-sm">
  
                    <input type="text" class="form-control float-right" oninput="javascript:this.value=this.value.toUpperCase();" placeholder="Buscar" [(ngModel)]="filterpost" name="filterpost" />
  
                    
  
                </div>
              </div>
  
  
            </div>
            <div class="card-body">
                <div class="row justify-content-between">
              
                  <span *ngIf="loadinglistado" class="justify-content-center text-center m-auto">
                    <div class="spinner-border text-primary" style="width: 3rem; height: 3rem;"></div>
                  </span>
  
                        <div class="table-responsive p-0">
                        <table class="design-table resp">
                          <thead>
                            <tr>
                              <th>SUBCATEGORIA</th>
                              <th>MARCA</th>
                              <th>DESCRIPCION</th>
                              <th>PVP</th>
                              <th><i class="fa fa-fw fa-barcode"></i></th>
                              <th><i class="fa fa-fw fa-barcode"></i></th>
                              <th width="200px"></th>
                            </tr>
                          </thead>
                          <tbody>
                          <tr *ngFor="let item of (datos | filterGenerico:filterpost:['subcategoria', 'marca', 'descripcion', 'codigo', 'codigo_adicional']) | paginate : {
                            itemsPerPage: pagesize,
                            currentPage: page,
                            totalItems: count
                          }">
                            <td>{{item.subcategoria}}</td>
                            <td>{{item.marca}}</td>
                            <td>{{item.descripcion}}</td>
                            <td><label class="text-success">{{item.precio_venta}}</label></td>
                            <td>{{item.codigo}}</td>
                            <td>{{item.codigo_adicional}}</td>
                            <td>
                              <div class="d-flex justify-content-end">
                                <button class="btn btn-primary btn-sm" data-bs-toggle="tooltip" data-bs-placement="top" title="CREAR CODIGO BARRA" (click)="visualizarcodigo(item.cod_producto, item.descripcion, item.codigo);"><i class="fa fa-barcode"></i></button>
                              </div>
                            </td>
                          </tr>
                          </tbody>
                        </table>
                        <div class="modal-footer d-flex justify-content-between align-items-center">
                          <span>Total: {{this.cantidad_registros}} Registros</span>
                          <pagination-controls class="pagination-controls"
                          previousLabel="Anterior"
                          nextLabel="Siguiente"
                          [responsive]="true"
                          (pageChange)="handlePageChange($event)">
                          </pagination-controls>
                        </div>
                    </div>
                </div>
  
  
  
  
  
  
            </div>
            <!-- /.card-body -->
          </div>
        <!-- /.Termina form1 -->
        <!-- /.Termina form1 -->
        <!-- /.Termina form1 -->
        </div>
  
      </div>
  
  
  
      
  
  
  
    </div>
  </section>
