<div id="mymodalfacturasproveedores" class="modal fade" role="dialog" data-backdrop="false">
  <div class="modal-dialog modal-xl">
    <!-- Modal content -->
    <div class="modal-content">
      <div class="modal-header">
  <h5 class="modal-title">FACTURAS PROVEEDOR - {{ descripcion }}</h5>
    <button type="button" class="close" data-dismiss="modal" aria-label="Close">
            <span aria-hidden="true">×</span>
          </button>
      </div>
      <div class="modal-body">
                  

        <div class="row justify-content-between">
          <span *ngIf="loadinglistado" class="justify-content-center text-center m-auto">
                <div class="spinner-border text-primary" style="width: 3rem; height: 3rem;"></div>
          </span>
        </div>
          

          <div class="row">
            <div class="col-md-12">
              <div class="table-responsive p-0">
                <table class="design-table">
                  <thead>
                    <tr>
                      <th>Nº COMPRA</th>
                      <th>Nº COMPRA PROV.</th>
                      <th>PROVEEDOR</th>
                      <th>FECHA REGISTRO</th>
                    </tr>
                  </thead>
                  <tbody>
                  <tr *ngFor="let item of datosfacturaproveedor | paginate : {
                    id : 'pagfacturaproveedor',
                    itemsPerPage: pagesizefacturaproveedor,
                    currentPage: pagefacturaproveedor,
                    totalItems: countfacturaproveedor
                  }">
                    <td>{{item.numero_factura}}</td>
                    <td>{{item.codigo}}</td>
                    <td>{{item.proveedor}}</td>
                    <td>{{item.fecha_hora}}</td>
                  </tr>
                  </tbody>
                </table>
                <div class="float-right">
                  <pagination-controls class="pagination-controls" id="pagfacturaproveedor"
                  previousLabel="Anterior"
                  nextLabel="Siguiente"
                  [responsive]="true"
                  (pageChange)="handlePageChangeFacturaProveedor($event)">
                  </pagination-controls>
                </div>
              </div>
            </div>

          </div>

          <div class="d-flex justify-content-end align-items-center">
            <button class="btn btn-secondary btn-sm" type="button" data-dismiss="modal"><i class="fas fa-times-circle"></i> Cerrar</button>
          </div>

      </div>
    </div>

  </div>
</div>
