<div id="mymodalagregarexistencias" class="modal fade" role="dialog" data-backdrop="false">
  <div class="modal-dialog">
    <!-- Modal content -->
    <div class="modal-content">
      <div class="modal-header">
      <h5 class="modal-title">AGREGAR EXISTENCIAS - {{ descripcion }} <span *ngIf="this.fraccionado=='SI'"> - ({{ unidades_denominacion }})</span></h5>
    <button type="button" class="close" data-dismiss="modal" aria-label="Close">
          <span aria-hidden="true">×</span>
          </button>
      </div>
      <div class="modal-body">

        <div class="row">

          <div class="col-md-12">

            <div id="accordion" role="tablist" aria-multiselectable="true" *ngFor="let item of datosexistencias; let i = index">
              <div class="card card-outline">

                  <a class="d-block w-100 collapsed" data-toggle="collapse" href="#collapseExample{{i}}" aria-expanded="false">
                    <div class="card-header">
                        <h4 class="card-title w-100">
                          <i class="fa fa-dolly-flatbed"></i> {{item.sucursal}}
                        </h4>
                    </div>
                  </a>

                  <div id="collapseExample{{i}}" class="collapse" role="tabpanel" aria-labelledby="headinginteriorcontenedor">
                      <div class="card-body">
                          <div class="row">			 

                            <div class="col-md-12">

                              <div class="form-group">
                                <label class="text-primary">{{item.sucursal}}</label>
                              </div>
        
                              <div *ngIf="this.kardex == '1' || this.control_estricto_inventario == '1'" class="col-md-12">

                                <!-- <div *ngIf="ban == 0" class="form-group">
                                  <label>Habilitar Almacenamiento:</label>
                                  <input type="checkbox" [checked]="item.habilitar" (change)="changeHabilitar(i)">
                                </div> -->

                                <div *ngIf="item.habilitar == true && ban == 1" class="form-group">
                                  <label>Habilitar Almacenamiento:</label>
                                  <input type="checkbox" [checked]="item.habilitar" disabled>
                                </div>

                                <div *ngIf="ban == 1 && item.habilitar == false" class="form-group">
                                  <label>Habilitar Almacenamiento:</label>
                                  <input type="checkbox" [checked]="item.habilitar" (change)="changeHabilitar(i)">
                                </div>

                              </div>

                              <div *ngIf="this.kardex == '0' && this.control_estricto_inventario == '0'" class="col-md-12">

                                <div class="form-group">
                                  <label>Habilitar Almacenamiento:</label>
                                  <input type="checkbox" [checked]="item.habilitar" (change)="changeHabilitar(i)">
                                </div>

                                <div>
                                  <div class="form-group" *ngIf="this.fraccionado=='SI'">
                                    <label>Cantidad Existentes:</label>
                                    <input [disabled]="!item.habilitar" [(ngModel)]="item.cantidad_denominacion" onKeyPress="return soloNumeros(event)" class="form-control form-control-sm" maxlength="9" placeholder="Cantidad Existentes" type="text" (keyup)="keyUpCalcularExistencias(i)">
                                  </div>
                      
                                  <div class="form-group" *ngIf="this.fraccionado=='SI'">
                                    <label class="text-primary">Total Unidades:</label>
                                    <label class="form-control form-control-sm">{{item.total_unidades}}</label>
                                  </div>
                      
                                  <div class="form-group">
                                    <label>Ajustar Existencias:</label>
                                    <input [disabled]="!item.habilitar" [(ngModel)]="item.ajustar_existencia" onKeyPress="return soloNumeros(event)" class="form-control form-control-sm" maxlength="9" placeholder="Ajustar Existencias" type="text" (keyup)="keyUpAjustarExistencias(i)">
                                  </div>
                      
                                  <div class="form-group">
                                    <label class="text-danger">Existencias:</label>
                                    <label class="form-control form-control-sm">{{item.existencia}}</label>
                                  </div>
                                </div>

                              </div>

        
                            </div>


                          </div>
                      </div>
                  </div>
              </div>
            </div>

           

            <div class="row justify-content-between">
              <span *ngIf="loading" class="justify-content-center text-center m-auto">
                    <div class="spinner-border text-primary" style="width: 3rem; height: 3rem;"></div>
              </span> 
            </div>

            <div class="d-flex justify-content-end align-items-center">
              <button (click)="actualizarexistencia();" type="button" class="btn btn-warning btn-sm"><i class="fas fa-save"></i> Actualizar</button>&nbsp;
              <button class="btn btn-secondary btn-sm" type="button" data-dismiss="modal"><i class="fas fa-times-circle"></i> Cerrar</button>
            </div>

          </div>


        </div>



      </div>



    </div>

  </div>
</div>
