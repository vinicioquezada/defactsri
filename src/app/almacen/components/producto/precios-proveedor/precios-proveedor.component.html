<div id="mymodalpreciosproveedores" class="modal fade" role="dialog" data-backdrop="false">
  <div class="modal-dialog modal-xl">
    <!-- Modal content -->
    <div class="modal-content">
      <div class="modal-header">
  <h5 class="modal-title">PRECIOS POR PROVEEDOR - {{ descripcion }}</h5>
    <button type="button" class="close" data-dismiss="modal" aria-label="Close">
            <span aria-hidden="true">×</span>
          </button>
      </div>
      <div class="modal-body">
                  

        <div class="row justify-content-between">
          <span *ngIf="loadinglistado" class="justify-content-center text-center m-auto">
                <div class="spinner-border text-primary" style="width: 3rem; height: 3rem;"></div>
          </span>
        </div>
          

          <div class="row">
            <div class="col-md-12">
              <div class="panel-body table-responsive">
                <table style='font-size: 14px;' class="design-table">
                  <thead>
                    <tr>
                      <th>PROVEEDOR</th>
                      <th>COSTO BASE P.</th>
                      <th>COSTO P.</th>
                      <th>DESCUENTO</th>
                      <th>COSTO BASE</th>
                      <th>COSTO</th>
                      <th>UTILIDAD</th>
                    </tr>
                  </thead>
                  <tbody>
                  <tr *ngFor="let item of datospreciosproveedor | paginate : {
                    id : 'pagpreciosproveedor',
                    itemsPerPage: pagesizepreciosproveedor,
                    currentPage: pagepreciosproveedor,
                    totalItems: countpreciosproveedor
                  }">
                    <td>{{item.proveedor}}</td>
                    <td>{{item.costo_base_proveedor}}</td>
                    <td>{{item.costo_proveedor}}</td>
                    <td>{{item.descuento_proveedor}}</td>
                    <td>{{item.costo_base}}</td>
                    <td>{{item.costo}}</td>
                    <td>{{item.utilidad}}</td>
                  </tr>
                  </tbody>
                </table>
                <div class="float-right">
                  <pagination-controls class="pagination-controls" id="pagpreciosproveedor"
                  previousLabel="Anterior"
                  nextLabel="Siguiente"
                  [responsive]="true"
                  (pageChange)="handlePageChangepreciosproveedor($event)">
                  </pagination-controls>
                </div>
              </div>
            </div>

          </div>

          <div class="d-flex justify-content-end align-items-center">
            <button class="btn btn-secondary btn-sm" type="button" data-dismiss="modal"><i class="fas fa-times-circle"></i> Cerrar</button>
          </div>

      </div>
    </div>

  </div>
</div>
