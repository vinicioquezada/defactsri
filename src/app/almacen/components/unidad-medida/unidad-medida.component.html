<section class="content-header">
  <div class="container-fluid">
    <div class="row mb-2">
      <div class="col-sm-12">
          <div class="btn-toolbar" role="toolbar">
            <div class="btn-group">
              <button (click)="clickDeshacer();" class="btn btn-secondary btn-flat btn-sm float-right" type="button"><i class="fas fa-redo-alt"></i> Deshacer</button>
              <button routerLink="/menualmacen" class="btn btn-secondary btn-flat btn-sm" type="button"><i class="fas fa-undo"></i> Atrás</button>
            </div>
          </div>
      </div>
      
    </div>
    
  </div><!-- /.container-fluid -->
</section>

<!-- Main content -->
<section class="content">
    <div class="container-fluid">
      <div class="row">

        <div class="col-md-4">
          
        <!-- /.Inicia form1 -->
        <!-- /.Inicia form1 -->
        <!-- /.Inicia form1 -->
          <div class="card card-primary card-outline">
            <div class="card-header">
              <h3 class="card-title"><i class="fa fa-file-alt"></i> Unidad Medida</h3>
            </div>
            <!-- /.card-header -->
            <div class="card-body">

                  <app-unidad-medida-form [tipoformulario] = "tipoformulario" (datosenvio)="recibirDatosUnidadMedida()"></app-unidad-medida-form>

            </div>
            <!-- /.card-body -->
          </div>
        <!-- /.Termina form1 -->
        <!-- /.Termina form1 -->
        <!-- /.Termina form1 -->

        </div>

        <div class="col-md-8">


          <div class="card card-primary card-outline">
            <div class="card-header">
              <h3 class="card-title"><i class="fa fa-search"></i> Listado</h3>

              <div class="card-tools">
                <div class="input-group input-group-sm" style="width: 150px;">
                

                  <input (keyup)="keyFiltrado();" type="text" class="form-control float-right" oninput="javascript:this.value=this.value.toUpperCase();" placeholder="Buscar" [(ngModel)]="filterpost" name="filterpost" autocomplete="off" />


                </div>

              </div>

              


            </div>

           
              <span *ngIf="loadinglistado" class="justify-content-center text-center m-auto">
                <div class="spinner-border text-primary" style="width: 3rem; height: 3rem;"></div>
              </span>
          
            
            <div class="table-responsive card-body p-0">
              <table class="design-table">
                <thead>
                  <tr>
                    <th>UNIDAD MEDIDA</th>
                    <th></th>
                  </tr>
                </thead>
                <tbody>
                  <tr  *ngFor="let item of (datos | filterGenerico:filterpost:['unidad_medida']) | paginate : {
                    itemsPerPage: pagesize,
                    currentPage: page,
                    totalItems: count
                  }">
                    <td>{{item.unidad_medida}}</td>
                    <td>
                      <div class="d-flex justify-content-end">
                        <button (click)="agregar(item.cod_unidad_medida);" class="btn btn-outline-primary btn-sm" type="button"><i class="fas fa-plus"></i></button>
                        <button (click)="clickEliminar(item.cod_unidad_medida, item.unidad_medida);" class="btn btn-outline-danger btn-sm"><i class="fa fa-trash"></i></button>
                      </div>
                    </td>
                  </tr>
                </tbody>
              </table>
              <div class="float-right">
                <pagination-controls class="pagination-controls"
                previousLabel="Anterior"
                nextLabel="Siguiente"
                [responsive]="true"
                (pageChange)="handlePageChange($event)">
                </pagination-controls>
              </div>
            </div>
            
          </div>

        
        </div>


       


      

      </div>

    </div>
</section>
