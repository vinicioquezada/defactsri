<div class="row">
                
  <div class="col-md-12">

      <div class="form-group">
        <label>Unidad Medida:</label><label class="text-danger">&nbsp;*</label>
        <input [ngClass]="{'is-invalid': flagunidadmedida}" [(ngModel)]="unidad_medida" autofocus class="form-control form-control-sm"  oninput="javascript:this.value=this.value.toUpperCase();" placeholder="Unidad Medida" type="text">
      </div>

      <div class="form-group">
        <label>Observacion:</label>
        <textarea [(ngModel)]="observacion" class="form-control"></textarea>
      </div>   
  </div>


</div>

<div style="text-align:center">
  <div *ngIf="loading" class="spinner-border text-primary" style="width: 3rem; height: 3rem;"></div>
</div>

<div class="d-flex justify-content-end align-items-center">
  <button [ngClass]="{'d-none': flagocultarboton}" (click)="clickGuardar();" class="btn btn-primary btn-sm" type="button"><i class="fas fa-save"></i> Guardar</button>
  <button [ngClass]="{'d-none': !flagocultarboton}" (click)="clickActualizar();" class="btn btn-warning btn-sm" type="button"><i class="fas fa-save"></i> Actualizar</button>&nbsp;
  <button *ngIf="tipoformulario=='agregar'" class="btn btn-secondary btn-sm" type="button" data-dismiss="modal"><i class="fas fa-times-circle"></i> Cerrar</button>
</div>
