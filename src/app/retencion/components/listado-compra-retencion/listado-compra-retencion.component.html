<div id="mymodallistarcompras" class="modal fade" role="dialog" data-backdrop="false">
  <div class="modal-dialog modal-xl">
    <!-- Modal content -->
    <div class="modal-content">
      <div class="modal-header">
      <h5 class="modal-title">LISTADO DE COMPRAS</h5>
    <button type="button" class="close" data-dismiss="modal" aria-label="Close">
          <span aria-hidden="true">×</span>
          </button>
      </div>
      <div class="modal-body">

        

        

        <div class="row">

          <div *ngIf="multisucursal=='1'" class="col-md-6">
           

            <div class="form-group">
                <label>Sucursal:</label>
                
                <select (change)="changeSucursal($event)" class="form-control form-control-sm">
                    <option value="{{item.cod_sucursal}}" *ngFor="let item of datossucursal" [selected]="this.cod_sucursal == item.cod_sucursal">
                        {{item.sucursal}}
                    </option>
                </select>

            </div>

          </div>

            <div class="col-md-3">
                <div class="form-group">
                    <label>Fecha Desde:</label>
                    <div class="input-group input-group-sm">
                    <div class="input-group-prepend">
                        <span class="input-group-text"><i class="fas fa-calendar"></i></span>
                    </div>
                    <input [(ngModel)]="fechadesde" type="date" class="form-control">
                    </div>
                </div>		 
            </div>

            <div class="col-md-3">
                <div class="form-group">
                    <label>Fecha Hasta:</label>
                    
                    <div class="input-group input-group-sm">
                        <div class="input-group-prepend">
                            <span class="input-group-text"><i class="fas fa-calendar"></i></span>
                        </div>
                        <input [(ngModel)]="fechahasta" type="date" class="form-control">
                        <span class="input-group-append">
                            <button (click)="clickBuscar();" class="btn btn-primary btn-flat" type="button"><i class="fa fa-search"></i></button>
                        </span>
                    </div>
                </div>	 
            </div>

        </div>

        <div class="row justify-content-between align-items-center">
          <span></span>
          <div class="input-group input-group-sm float-right" style="width: 150px;">
            <input (keyup)="keyFiltrado();" type="text" class="form-control float-right" oninput="javascript:this.value=this.value.toUpperCase();" placeholder="Buscar" [(ngModel)]="filterpost" name="filterpost" autocomplete="off" />
          </div>
        </div>

        <br>
          
          <div class="row justify-content-between">
        
            <span *ngIf="loadinglistado" class="justify-content-center text-center m-auto">
              <div class="spinner-border text-primary" style="width: 3rem; height: 3rem;"></div>
            </span>
            
            <div class="table-responsive p-0">
              <table class="design-table resp">
                <thead>
                  <tr>
                    <th width="50px">Nº</th>
                    <th width="50px">ESTADO</th>
                    <th width="100px">DOCUMENTO</th>
                    <th width="300px">PROVEEDOR</th>
                    <th width="100px">FECHA</th>
                    <th width="50px">TOTAL</th>
                    <th width="100px"></th>
                  </tr>
                </thead>
                <tbody>
                  <tr *ngFor="let item of (datos | filterGenerico:filterpost:['numero_factura', 'fecha_hora', 'ruc', 'proveedor', 'estado', 'importetotal']) | paginate : {
                    id : 'pagproducto',
                    itemsPerPage: pagesize,
                    currentPage: page,
                    totalItems: count
                  }">
                    <td>{{item.numero_factura}}</td>
                    <td>
                      <small *ngIf="item.estado=='CREADA'" class="badge badge-success">{{item.estado}}</small>
                      <small *ngIf="item.estado=='ANULADA'" class="badge badge-warning">{{item.estado}}</small>
                      <small *ngIf="item.nota_credito_compra=='1'" class="badge badge-warning">NOTA CREDITO APLICADA</small>
                    </td>
                    <td>{{item.ruc}}</td>
                    <td>
                      {{item.proveedor}}<br>
                    </td>
                    <td>{{item.fecha_hora}}</td>
                    <td>{{item.importetotal | number}}</td>
                    <td>
                      <div>
                        <div class="d-flex justify-content-end">
                          <button (click)="agregar(item.cod_factura_compra, item.numero_factura, item.estado, item.proveedor);" data-bs-toggle="tooltip" data-bs-placement="top" title="OPCIONES" class="btn btn-outline-primary btn-sm" type="button"><i class="fa fa-plus"></i></button>
                        </div>
                      </div>
                      
                    </td>
                  </tr>
                </tbody>
              </table>
              <div class="float-right">
                <pagination-controls class="pagination-controls" id="pagproducto"
                previousLabel="Anterior"
                nextLabel="Siguiente"
                [responsive]="true"
                (pageChange)="handlePageChange($event)">
                </pagination-controls>
              </div>
            </div>

          </div>

          <div class="d-flex justify-content-end align-items-center">
            <!-- <button (click)="actualizarListadoCliente();" type="button" class="btn btn-primary btn-sm" data-dismiss="modal"><i class="fas fa-save"></i> Actualizar</button>&nbsp; -->
            <button class="btn btn-secondary btn-sm" type="button" data-dismiss="modal"><i class="fas fa-times-circle"></i> Cerrar</button>
          </div>

      </div>
      
    </div>

  </div>
</div>
