<div id="mymodalformapago" class="modal fade" role="dialog" data-backdrop="false">
    <div class="modal-dialog">

      <div class="modal-content">
        <div class="modal-header">
        <h5 class="modal-title">FORMAS DE PAGO</h5>
      <button type="button" class="close" data-dismiss="modal" aria-label="Close">
            <span aria-hidden="true">×</span>
            </button>
        </div>
        <div class="modal-body">
            
          <div class="row justify-content-between">
  
            <span *ngIf="loadinglistado" class="justify-content-center text-center m-auto">
              <div class="spinner-border text-primary" style="width: 3rem; height: 3rem;"></div>
            </span>

          </div>

          <div class="row">

            <div class="col-md-12">

            

                <div class="form-group">
                 
                  <select [(ngModel)]="id_forma_pago" (change)="changeFormaPago($event)" class="form-control form-control-sm">
                    <option value="{{item.id_forma_pago}}" *ngFor="let item of datosformapago">
                        {{item.forma_pago}}
                    </option>
                  </select>
       
                </div>

            </div>

            <div class="col-md-12">

          
                <div class="form-group">
                  <div class="input-group input-group-sm">
                    <input [(ngModel)]="valorimpuesto" class="form-control form-control-sm" type="text" onKeyPress="return soloNumeros(event)" (keyup.enter)="agregarFormaPago();">
                    <span class="input-group-append">
                      <button (click)="agregarFormaPago();" class="btn btn-primary btn-flat btn-sm"> Agregar</button>
                    </span>
                  </div>
                </div>

                <div *ngIf="!chkcontado" class="form-group">
                  <input onkeypress="return soloNumerosEnteros(event)" [ngClass]="{'is-invalid': flagplazo}" [(ngModel)]="plazo" class="form-control form-control-sm" placeholder="Plazo" type="text">
                </div>

                <div *ngIf="!chkcontado" class="form-group">
                  <select [ngClass]="{'is-invalid': flagtiempo}" [(ngModel)]="tiempo" class="form-control form-control-sm">
                    <option value="dias">dias</option>
                    <option value="meses">meses</option>
                  </select>
                </div>
            </div>

          </div>
  
          <div class="d-flex justify-content-end">
            <button *ngIf="ban==1" class="btn btn-danger btn-sm" (click)="quitarFormaPago();" type="button" data-dismiss="modal"><i class="fas fa-trash"></i> Quitar</button>&nbsp;
            <button class="btn btn-secondary btn-sm" type="button" data-dismiss="modal"><i class="fas fa-times-circle"></i> Cerrar</button>
          </div>
  
        </div>
  
      </div>
  
    </div>
</div>

<div class="form-group row">
  <label for="inputEmail3" class="col-sm-4 col-form-label">Forma:</label>
  <div class="col-sm-8">
      <div class="input-group input-group-sm">

        <button [disabled]="disabledformapago" (click)="clickMasFormas();" class="btn btn-primary btn-block btn-sm mb-2" type="button"><i class="fas fa-money-bill-alt"></i> Más Formas</button>

      </div>
  </div>

  <div class="position-relative custom-label mb-2" *ngFor="let item of datosformapagoseleccion">
    <label (click)="clickEditarForma(item)" class="d-block m-0 cursor-pointer">
      {{ item.forma_pago }}
      <span class="badge bg-success position-absolute" style="top: -10px; right: 10px;">
        {{ item.valor }}
      </span>
    </label>
  </div>

</div>
