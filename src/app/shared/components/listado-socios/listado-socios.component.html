<div id="mymodallistarsocios" class="modal fade" role="dialog" data-backdrop="false">
  <div class="modal-dialog modal-xl">
    <!-- Modal content -->
    <div class="modal-content">
      <div class="modal-header">
      <h5 class="modal-title">LISTADO DE SOCIOS</h5>
    <button type="button" class="close" data-dismiss="modal" aria-label="Close">
          <span aria-hidden="true">×</span>
          </button>
      </div>
      <div class="modal-body">

        <div class="row justify-content-between align-items-center">
          <span>Total: {{this.cantidad_registros_socio}} Registros</span>
          <div class="input-group input-group-sm float-right" style="width: 150px;">
            <input (keyup)="keyFiltradoSocio();" type="text" class="form-control float-right" oninput="javascript:this.value=this.value.toUpperCase();" placeholder="Buscar" [(ngModel)]="filterpostsocio" name="filterpostsocio" />
          </div>
        </div>

        <br>
        
        <div class="row justify-content-between">

          <div *ngIf="loadingmodal" class="justify-content-center text-center m-auto">
            <div class="spinner-border text-primary" style="width: 3rem; height: 3rem;"></div>
          </div>
          
          <div class="table-responsive p-0">
            <table class="design-table resp">
              <thead>
                <tr>
                  <th>CÉDULA/RUC</th>
                  <th>APELLIDO</th>
                  <th>NOMBRE</th>
                  <th>IDENTIFICACIÓN</th>
                  <th></th>
                </tr>
              </thead>
              <tbody>
                <tr *ngFor="let item of (datossocios | filterGenerico:filterpostsocio:['cedula', 'apellido', 'nombre', 'identificacion']) | paginate : {
                  id : 'pagsocios',
                  itemsPerPage: pagesizesocio,
                  currentPage: pagesocio,
                  totalItems: countsocio
                }">
                  <td>{{item.cedula}}</td>
                  <td>{{item.apellido}}</td>
                  <td>{{item.nombre}}</td>
                  <td>{{item.identificacion}}</td>
                  <td>
                    <div class="d-flex justify-content-end">
                      <button (click)="agregar(item.cod_cliente);" class="btn btn-outline-primary btn-sm" type="button"><i class="fas fa-plus"></i></button>
                    </div>
                  </td>
                </tr>
              </tbody>
            </table>
            <div class="float-right">
              <pagination-controls class="pagination-controls"
              id="pagsocios"
              previousLabel="Anterior"
              nextLabel="Siguiente"
              [responsive]="true"
              (pageChange)="handlePageChangeSocio($event)">
              </pagination-controls>
            </div>
          </div>
        </div>

        <div class="d-flex justify-content-end align-items-center">
            <button (click)="actualizarListadoCliente();" type="button" class="btn btn-primary btn-sm" data-dismiss="modal"><i class="fas fa-sync-alt"></i> Actualizar</button>&nbsp;
            <button class="btn btn-secondary btn-sm" type="button" data-dismiss="modal"><i class="fas fa-times-circle"></i> Cerrar</button>
          </div>

      </div>

    </div>

  </div>
</div>
