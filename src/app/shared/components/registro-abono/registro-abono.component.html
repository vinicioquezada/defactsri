<div id="mymodalregistroabono" class="modal fade" role="dialog" data-backdrop="false">
    <div class="modal-dialog">
      <!-- Modal content -->
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">REGISTRO DE ABONO - {{this.tipo_abono}}</h5>
          <button type="button" class="close" data-dismiss="modal" aria-label="Close">
            <span aria-hidden="true">×</span>
          </button>
        </div>

        <div class="modal-body">
         
          <div class="row">
              <div class="col-md-12">
                <div class="row">
                    <div class="col-md-6">
                        <div class="form-group">
                          <label>N° Documento:</label>
                            <div class="input-group input-group-sm">
                              <label class="form-control" style="color:#0000FF;">{{this.numero_factura}}</label>      
                            </div>
                        </div>
                    </div>

                    <div class="col-md-6">
                        <div class="form-group">
                          <label>Deuda $:</label>
                            <div class="input-group input-group-sm">
                              <label *ngIf="ban==0" class="form-control" style="color:#FF0000;">{{this.deuda_valor}}</label>
                              <label *ngIf="ban==1" class="form-control" style="color:#FF0000;">{{this.deuda_valor_editar}}</label>
                            </div>
                        </div>
                    </div>
                </div>
              </div>
          </div>

          <!-- <div class="row">
              <div class="col-md-12">
                      <div class="form-group">
                        <label>Tipo Abono:</label>
                          <div class="input-group input-group-sm">
                            <label class="form-control">{{this.tipo_abono}}</label>
                          </div>
                      </div>
              </div>
          </div> -->

          <div class="row">
              <div class="col-md-12">
                      <div class="form-group">
                        <label>Forma Cobro:</label>
                          <div class="input-group input-group-sm">
                            <select (change)="changeFormaPago($event)" class="form-control form-control-sm">
                              <option value="{{item.id_forma_pago}}" *ngFor="let item of datosformapago" [selected]="item.id_forma_pago == this.id_forma_pago">
                                  {{item.forma_pago}}
                              </option>
                          </select>
                          </div>
                      </div>

              </div>
          </div>

         
          <div *ngIf="tipo_credito==2" class="row">
              <div class="col-md-12">
                <div class="row">
                    <div class="col-md-6">
                      <div class="form-group">
                        <label>Fecha Máximo de pago:</label>
                          <div class="input-group input-group-sm">
                            <label class="form-control" id="lblfechamaximopago"></label>                            
                          </div>
                      </div>
                    </div>

                    <div class="col-md-6">
                        <div class="form-group">
                          <label>Valor por Mora:</label>
                            <div class="input-group input-group-sm">
                              <label class="form-control" style="color:#FF0000;" id="lblvalormora"></label>      
                            </div>
                        </div>
                    </div>
                </div>
              </div>
          </div>


          <div class="row">
              <div class="col-md-12">
                      <div class="form-group">
                        <label>Ingrese Abono:</label>
                          <div class="input-group input-group-sm">
                            <input [(ngModel)]="valor_cuota" (keyup.enter)="calcularAcredorAbono();" type="text" class="form-control" maxlength="10" placeholder="Ingrese Abono" onKeyPress="return soloNumeros(event)">
                            <span class="input-group-append">
                              <button (click)="calcularAcredorAbono();" class="btn btn-primary" type="button"><i class="fa fa-calculator"></i></button>
                            </span>
                          </div>
                      </div>

                      <div class="form-group">
                        <label>Observación:</label>
                          <div class="input-group input-group-sm">
                            <textarea [(ngModel)]="observacion" class="form-control"></textarea>
                          </div>
                      </div>

                      <div class="form-group">
                              <div id="lbltotalpagarmora">
                              </div>
                      </div>

                      <div class="form-group">
                        <div *ngIf="textomensaje != ''" style='text-align: center;'>        
                            <label style='font-size:30px;' [ngStyle]="{'color':colormensaje}">{{textomensaje}}</label>
                        </div>
                      </div>
                      
              </div>
          </div>

         
          <div style="text-align:center">
            <div *ngIf="loading" class="spinner-border text-primary" style="width: 3rem; height: 3rem;"></div>
          </div>

          <div class="d-flex justify-content-end align-items-center">
            <button (click) = "clickGuardarAbono();" *ngIf="ban == 0" [disabled]="disabledbtnguardarabono" class="btn btn-primary btn-sm" type="button"><i class="fa fa-save"></i> Guardar Abono</button>
            <button (click) = "clickActualizarAbono();" *ngIf="ban == 1" [disabled]="disabledbtnactualizarabono" class="btn btn-primary btn-sm"><i class='fa fa-edit'></i> Actualizar Abono</button>
            <div *ngIf="ban == 1">
              &nbsp;
              <button *ngIf="!this.opcionesprivilegios['bloqueoanulacionabonoventa']" (click) = "clickAnularAbono();" class="btn btn-warning btn-sm"><i class='fa fa-trash'></i> Anular Abono</button>
            </div>
            &nbsp;
            <button class="btn btn-secondary btn-sm" type="button" data-dismiss="modal"><i class="fas fa-times-circle"></i> Cerrar</button>
          </div>
         

        </div>
      </div>
    </div>
</div>
