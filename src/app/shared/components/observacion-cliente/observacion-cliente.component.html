<div id="mymodalobservacion" class="modal fade" role="dialog" data-backdrop="false">
  <div class="modal-dialog">
    <!-- Modal content -->
    <div class="modal-content">
      <div class="modal-header">
      <h5 class="modal-title">OBSERVACION {{ cliente }}</h5>
          <button type="button" class="close" data-dismiss="modal" aria-label="Close">
            <span aria-hidden="true">×</span>
          </button>
      </div>
      <div class="modal-body">

        <div class="row justify-content-between">
          <span *ngIf="loadingobservacion" class="justify-content-center text-center m-auto">
            <div class="spinner-border text-primary" style="width: 3rem; height: 3rem;"></div>
          </span>
        </div>

        <div [innerHTML]="observacion"></div>

        <div *ngIf="opcion=='gestion'" class="d-flex justify-content-end align-items-center">
          <button (click)="eliminarObservacion()" class="btn btn-danger btn-sm mr-1" type="button"><i class="fas fa-trash"></i> Eliminar</button>
          <button class="btn btn-secondary btn-sm" type="button" data-dismiss="modal"><i class="fas fa-times-circle"></i> Cerrar</button>
        </div>

      </div>

    </div>

  </div>
</div>
