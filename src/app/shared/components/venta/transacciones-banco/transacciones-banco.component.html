

    <div class="input-group input-group-sm mb-3">
      <input [disabled]="disabledtransaccionbanco" (keyup.enter)="buscarNumeroTransaccion();" type="text" class="form-control" placeholder="Escribe la numeración" [(ngModel)]="numero_transaccion">
      <div class="input-group-append">
        <button [disabled]="disabledtransaccionbanco" (click)="buscarNumeroTransaccion();" class="btn btn-primary" type="button"> <span class="fa fa-plus"></span> Agregar</button>
      </div>
    </div>
  
    <ul class="list-group py-2">
        <li class="list-group-item py-1 d-flex justify-content-between align-items-center" *ngFor="let item of datostransaccionbanco; let i = index">
          {{ item.numero_transaccion }}
          <button [disabled]="disabledtransaccionbanco" (click)="borrar(i);" class="btn btn-danger btn-sm"><span class="fa fa-trash"></span></button>
        </li>
      </ul>
