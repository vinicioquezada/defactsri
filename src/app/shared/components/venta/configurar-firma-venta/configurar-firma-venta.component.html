<div id="mymodalconfigurarfirmaventa" class="modal fade" role="dialog" data-backdrop="false">
    <div class="modal-dialog">

      <div class="modal-content">
        <div class="modal-header">
        <h5 class="modal-title">FIRMAS</h5>
      <button type="button" class="close" data-dismiss="modal" aria-label="Close">
            <span aria-hidden="true">×</span>
            </button>
        </div>
        <div class="modal-body">
            
          <div class="row justify-content-between">
  
            <span *ngIf="loadinglistado" class="justify-content-center text-center m-auto">
              <div class="spinner-border text-primary" style="width: 3rem; height: 3rem;"></div>
            </span>

          </div>

          <div class="row">

            <div class="col-md-12">

            

                <div class="form-group">
                 
                  <select [(ngModel)]="cod_ruc" (change)="changeEmpresa($event)" class="form-control form-control-sm">
                    <option value="{{item.cod_ruc}}" *ngFor="let item of datosrucempresa" [selected]="item.cod_ruc == cod_ruc">
                        {{item.empresa}}
                    </option>
                  </select>
       
                </div>

            </div>

          

          </div>
  
          <div class="d-flex justify-content-end">
            <button  class="btn btn-primary btn-sm" (click)="clickGuardar();" type="button" data-dismiss="modal"><i class="fas fa-save"></i> Guardar</button>&nbsp;
            <button class="btn btn-secondary btn-sm" type="button" data-dismiss="modal"><i class="fas fa-times-circle"></i> Cerrar</button>
          </div>
  
        </div>
  
      </div>
  
    </div>
</div>

<button (click)="configurarFirmaVenta();" class="btn btn-warning btn-flat" type="button"><i class="fa fa-cog"></i></button>
