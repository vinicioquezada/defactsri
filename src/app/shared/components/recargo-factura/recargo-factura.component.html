<div class="form-group row">
    <label for="inputEmail3" class="col-sm-4 col-form-label">Recargo:</label>
    <div class="col-sm-8">
        <div class="input-group input-group-sm">
              <select [disabled]="disabledcmbrecargo" (change)="changeFormaPago($event)" class="form-control form-control-sm">
                  <option value="{{item.cod_transaccion_tarjeta}}" *ngFor="let item of transacciontarjeta" [selected]="this.recargo.cod_transaccion_tarjeta == item.cod_transaccion_tarjeta">
                      {{item.transaccion_tarjeta}}
                  </option>
              </select>
        </div>
    </div>
  </div>
  
  
  <div *ngIf="this.recargo.cod_transaccion_tarjeta != 0">
    <div class="form-group row">
        <label for="inputEmail3" class="col-sm-4 col-form-label">Tarifa:</label>
        <div class="col-sm-8">
                <div class="input-group input-group-sm">
                    <div class="input-group-prepend">
                        <span class="input-group-text"><i class="fas fa-credit-card"></i></span>
                    </div>
                    <select (change)="changeTarjetaTarifa($event)" class="form-control form-control-sm">
                          <option value="0"></option>
                          <option value="{{item.cod_tarifa_recargo}}" *ngFor="let item of tarifarecargo">
                              {{item.tarifa_recargo}}%
                          </option>
                      </select>
                </div>
        </div>
    </div>
  </div>
