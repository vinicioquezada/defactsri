<div id="mymodallistarproveedores" class="modal fade" role="dialog" data-backdrop="false">
  <div class="modal-dialog modal-xl">
    <!-- Modal content -->
    <div class="modal-content">
      <div class="modal-header">
      <h5 class="modal-title">LISTADO DE PROVEEDORES</h5>
    <button type="button" class="close" data-dismiss="modal" aria-label="Close">
          <span aria-hidden="true">×</span>
          </button>
      </div>
      <div class="modal-body">

        <div class="row justify-content-between align-items-center">
          <span>Total: {{this.cantidad_registros}} Registros</span>
          <div class="input-group input-group-sm float-right" style="width: 150px;">
            <input (keyup)="keyFiltrado();" type="text" class="form-control float-right" oninput="javascript:this.value=this.value.toUpperCase();" placeholder="Buscar" [(ngModel)]="filterpost" name="filterpost" autocomplete="off" />
          </div>
        </div>

        <br>
          
          <div class="row justify-content-between">
        
            <span *ngIf="loadinglistado" class="justify-content-center text-center m-auto">
              <div class="spinner-border text-primary" style="width: 3rem; height: 3rem;"></div>
            </span>
        
            <div class="table-responsive p-0">
              <table class="design-table resp">
                <thead>
                  <tr>
                    <th>RUC</th>
                    <th>APELLIDO/RAZÓN SOCIAL</th>
                    <th>NOMBRE/NOMBRE COMERCIAL</th>
                    <th>IDENTIFICACIÓN</th>
                    <th></th>
                  </tr>
                </thead>
                <tbody>
                  <tr *ngFor="let item of (datos | filterGenerico:filterpost:['ruc', 'razon_social', 'nombre_comercial']) | paginate : {
                    id : 'pagproveedor',
                    itemsPerPage: pagesize,
                    currentPage: page,
                    totalItems: count
                  }">
                    <td>{{item.ruc}}</td>
                    <td>{{item.razon_social}}</td>
                    <td>{{item.nombre_comercial}}</td>
                    <td>{{item.identificacion}}</td>
                    <td>
                      <button (click)="agregar(item.cod_proveedor);" class="btn btn-outline-primary btn-sm" type="button"><i class="fas fa-plus"></i></button>
                    </td>
                  </tr>
                </tbody>
              </table>
              <div class="float-right">
                <pagination-controls class="pagination-controls" id="pagproveedor"
                previousLabel="Anterior"
                nextLabel="Siguiente"
                [responsive]="true"
                (pageChange)="handlePageChange($event)">
                </pagination-controls>
              </div>
            </div>
          </div>
        
          <div class="d-flex justify-content-end align-items-center">
            <button (click)="actualizarListadoProveedor();" type="button" class="btn btn-primary btn-sm" data-dismiss="modal"><i class="fas fa-sync-alt"></i> Actualizar</button>&nbsp;
            <button class="btn btn-secondary btn-sm" type="button" data-dismiss="modal"><i class="fas fa-times-circle"></i> Cerrar</button>
          </div>

      </div>
      
    </div>

  </div>
</div>
