<div id="mymodalVehiculo" class="modal fade" role="dialog" data-backdrop="false">
  <div class="modal-dialog">
    <!-- Modal content -->
    <div class="modal-content">
      <div class="modal-header">
      <h5 class="modal-title">NUEVA PLACA</h5>
    <button type="button" class="close" data-dismiss="modal" aria-label="Close">
          <span aria-hidden="true">×</span>
          </button>
      </div>

      <div class="modal-body">

        <div style="text-align:center">
          <div *ngIf="loading" class="spinner-border text-primary" style="width: 3rem; height: 3rem;"></div>
        </div>

        <div class="row">
              
          <div class="col-md-12">

              <div class="form-group">
                <label>Placa:</label><label class="text-danger">&nbsp;*</label>
                <input [ngClass]="{'is-invalid': flagplaca}" [(ngModel)]="placa" autofocus class="form-control form-control-sm"  oninput="javascript:this.value=this.value.toUpperCase();" placeholder="Ruta" type="text">
              </div>

              <div class="form-group">
                <label>Descripcion:</label>
                <textarea [(ngModel)]="descripcion" class="form-control"></textarea>
              </div>   
          </div>


        </div>

        <div class="d-flex justify-content-end align-items-center">
          <button (click)="clickGuardar();" class="btn btn-primary btn-sm" type="button"><i class="fas fa-save"></i> Guardar</button>&nbsp;
          <button class="btn btn-secondary btn-sm" type="button" data-dismiss="modal"><i class="fas fa-times-circle"></i> Cerrar</button>
        </div>

      </div>

      


   </div>

 </div>
</div>
