<div id="mymodalactividadreservaform" class="modal fade" role="dialog" data-backdrop="false">
  <div class="modal-dialog">
    <!-- Modal content -->
    <div class="modal-content">
  <div class="modal-header">
      <h5 class="modal-title">{{ dia }}</h5>
    <button type="button" class="close" data-dismiss="modal" aria-label="Close">
          <span aria-hidden="true">×</span>
          </button>
      </div>
      <div class="modal-body">
                  

        <div class="table-responsive p-0">
          <table class="design-table resp">
            <thead>
                <tr>
                    <th>HORA INICIO</th>
                    <th>HORA FIN</th>
                    <th>CUPOS</th>
                    <th>DISPONIBLES</th>
                    <th></th>
                </tr>
            </thead>
            <tbody>
                <tr *ngFor="let item of datos">
                    <td>{{item.hora_inicio}}</td>
                    <td>{{item.hora_fin}}</td>
                    <td>{{item.cupo_maximo}}</td>
                    <td>{{item.cupo_disponibles}}</td>
                    <td>
                        <div class="d-flex justify-content-end">
                          <button *ngIf="item.cupo_disponibles > 0" (click)="clickReservar(item);" class="btn btn-outline-primary btn-sm" type="button"><i class="fas fa-calendar"></i></button>
                          <small *ngIf="item.cupo_disponibles <= 0" class="badge badge-danger">Sin Cupo</small>
                        </div>
                    </td>
                </tr>
            </tbody>
            </table>
            
        </div>

        <div class="d-flex justify-content-end align-items-center">
          <button class="btn btn-secondary btn-sm" type="button" data-dismiss="modal"><i class="fas fa-times-circle"></i> Cerrar</button>
        </div>

      </div>

    </div>

  </div>
</div>
