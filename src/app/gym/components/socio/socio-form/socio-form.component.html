<div id="mymodalnuevosocio" class="modal fade" role="dialog" data-backdrop="false">
  <div class="modal-dialog  modal-lg">
    <!-- Modal content -->
    <div class="modal-content">
      <div class="modal-header">
      <h5 class="modal-title">{{ nombreformulario }} SOCIO</h5>
        <button type="button" class="close" data-dismiss="modal" aria-label="Close">
          <span aria-hidden="true">×</span>
        </button>
      </div>

      <div class="modal-body overlay-wrapper">

        <div *ngIf="loadinglistado" class="overlay overlay-custom d-flex flex-column align-items-center">
            <div class="spinner-border text-primary" style="width: 5rem; height: 5rem; font-size: 30px;" role="status"></div>
            <div class="text-bold pt-2">Cargando...</div>
        </div>

        <div class="row">

            <div class="col-md-6">
                <div class="form-group">
                        <label>Identificación: </label><label class="text-danger">&nbsp;*</label>
                            <select [ngClass]="{'is-invalid': flagidentificacion}" (change)="changeIdentificacion($event)" class="form-control form-control-sm">
                                <option value="{{item.cod_identificacion}}" *ngFor="let item of datosidentificacion" [selected]="item.cod_identificacion==cod_identificacion">
                                {{item.identificacion}}
                            </option>
                            </select>
                </div>

                <div class="form-group">
                    <label>{{lblcedula}} </label><label class="text-danger">&nbsp;*</label>
                    <input class="d-none form-control" id="txtcodcliente" type="text">
                    <div class="input-group input-group-sm">
                            <input (keyup.enter)="clickBuscarCliente();" [ngClass]="{'is-invalid': flagcedula}" [(ngModel)]="cedula" autofocus class="form-control"  oninput="javascript:this.value=this.value.toUpperCase();" type="text">
                            <span class="input-group-append">
                            <button *ngIf="nombreformulario=='NUEVO'" (click)="clickBuscarCliente();" class="btn btn-primary btn-flat" type="button"><i class="fa fa-search"></i></button>
                            </span>
                    </div>
                </div>

                <div class="form-group">
                    <label>Apellido: </label>
                    <input [(ngModel)]="apellido" oninput="javascript:this.value=this.value.toUpperCase();" class="form-control form-control-sm" placeholder="" type="text">
                </div>

                <div class="form-group">
                    <label>Nombre: </label>
                    <input [(ngModel)]="nombre" oninput="javascript:this.value=this.value.toUpperCase();" class="form-control form-control-sm" placeholder="" type="text">
                </div>


                <div class="form-group">
                    <label>Género:</label>
                    <select [ngClass]="{'is-invalid': flaggenero}" (change)="changegenero($event)" class="form-control form-control-sm">
                        <option [value]="item.cod_genero" *ngFor="let item of datosgenero" [selected]="item.cod_genero == cod_genero">
                            {{item.genero}}
                        </option>
                    </select>
                    
                </div>	


                <div class="form-group">
                    <label>Convencional:</label>
                    <input [(ngModel)]="convencional" class="form-control form-control-sm" maxlength="15" placeholder="Convencional" type="text"> 
                </div> 
                    
            </div>

            <div class="col-md-6">
                
                <div class="form-group">
                    <label>Celular: </label>
                    <input [(ngModel)]="celular" onKeyPress="return soloNumerosEnteros(event)" class="form-control form-control-sm" maxlength="15" placeholder="Celular" type="text"> 
                </div>

                    <div class="form-group">
                    <label>Correo: </label>
                    <input [(ngModel)]="correo" class="form-control form-control-sm" maxlength="50" placeholder="Correo" type="text">
                </div>

                <div class="form-group">
                    <label>Dirección: </label>
                    <input [(ngModel)]="direccion" class="form-control form-control-sm" maxlength="100" placeholder="Dirección" type="text">
                </div>

                <div class="form-group">
                    <label>Talla: </label>
                    <input [(ngModel)]="talla" oninput="javascript:this.value=this.value.toUpperCase();" class="form-control form-control-sm" placeholder="Talla" type="text">
                </div>

                <div class="form-group">
                    <label>Fecha Nacimiento: </label>
                    <input [ngClass]="{'is-invalid': flagfechanacimiento}" [(ngModel)]="fecha_nacimiento" class="form-control form-control-sm" placeholder="" type="date">
                </div>

                <div class="form-group">
                    <label>Tipo Usuario: </label><label class="text-danger">&nbsp;*</label>
                    <select [ngClass]="{'is-invalid': flagtipousuariogym}" (change)="changeTipoUsuarioGym($event)" class="form-control form-control-sm">
                        <option value="{{item.cod_tipo_usuario_gym}}" *ngFor="let item of datostipousuariogym" [selected]="item.cod_tipo_usuario_gym==cod_tipo_usuario_gym">
                            {{item.tipo_usuario_gym}}
                        </option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Tipo cliente: </label><label class="text-danger">&nbsp;*</label>
                    <select [ngClass]="{'is-invalid': flagtipocliente}" (change)="changeTipoCliente($event)" class="form-control form-control-sm">
                        <option value="{{item.cod_tipo_cliente}}" *ngFor="let item of datostipocliente" [selected]="item.cod_tipo_cliente==cod_tipo_cliente">
                            {{item.tipo_cliente}}
                        </option>
                    </select>
                </div>

                

                

            </div>

        </div>


        <div style="text-align:center">
            <div *ngIf="loading" class="spinner-border text-primary" style="width: 3rem; height: 3rem;"></div>
        </div>

        <div class="d-flex justify-content-end align-items-center">
            <button *ngIf="!flagocultaremparejamiento" [ngClass]="{'d-none': flagocultarboton}" (click)="clickGuardar();" class="btn btn-primary btn-sm mr-1" type="button"><i class="fas fa-save"></i> Guardar</button>
            <button *ngIf="!flagocultaremparejamiento" [ngClass]="{'d-none': !flagocultarboton}" (click)="clickActualizar();" class="btn btn-warning btn-sm mr-1" type="button"><i class="fas fa-save"></i> Actualizar</button>
            <button class="btn btn-secondary btn-sm" type="button" data-dismiss="modal"><i class="fas fa-times-circle"></i> Cerrar</button>
        </div>
          

      </div>

    </div>

  </div>
</div>
