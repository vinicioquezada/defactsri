<div id="mymodaleditardatosfoto" class="modal fade" role="dialog" data-backdrop="false">
  <div class="modal-dialog">
    <div class="modal-content">
<div class="modal-header">
      <h5 class="modal-title">SOCIO: {{ cliente }}</h5>
        <button type="button" class="close" data-dismiss="modal" aria-label="Close" (click)="closeCamera();">
          <span aria-hidden="true">×</span>
         </button>
      </div>

      <div class="modal-body">

        <div class="text-center">
          <img class="profile-user-img img-fluid" [src]="this.urlfoto" alt="Foto no asignada">
        </div>

        <!-- <video class="img-fluid" autoplay playsinline></video> -->

        <div class="row">
                
            <div class="col-md-12">

                <div class="form-group">
                  <label>Numero Socio:</label>
                  <label class="form-control form-control-sm">{{ numero_usuario }}</label>
                </div>

                <div class="form-group">
                  <label>Socio:</label>
                  <label class="form-control form-control-sm">{{ cliente }}</label>
                </div>

                  
            </div>

            <div class="col-md-12 d-flex justify-content-between align-items-center">
              <small class="badge" [ngClass]="usuariodispositivo1 ? 'badge-success' : 'badge-danger'">{{infousuariodispositivo1}}</small>
              <!-- <small *ngIf="item.estado=='CREADA'" class="badge badge-success" [ngClass]="usuariodispositivo1 ? 'badge-success' : 'badge-error'">{{infousuariodispositivo1}}</small> -->

              <small *ngIf="compartido_extension=='1'" class="badge" [ngClass]="usuariodispositivo2 ? 'badge-success' : 'badge-danger'">{{infousuariodispositivo2}}</small>
            </div>
        </div>

        
      </div>

       <div class="modal-footer">
        <button *ngIf="numero_usuario =='NA'" class="btn btn-primary btn-block btn-sm" (click)="clickImportar()"><i class="fas fa-file-import"></i> Importar datos e imagen al dispositivo</button>
        <button *ngIf="numero_usuario !='NA'" class="btn btn-warning btn-block btn-sm" (click)="clickActualizarSoloDatos()"><i class="fas fa-save"></i> Actualizar solo datos dispositivo</button>
        <button *ngIf="numero_usuario !='NA'" class="btn btn-warning btn-block btn-sm" (click)="clickActualizarFotoWebDispositivo()"><i class="fas fa-camera"></i> Abrir cámara para actualizar Foto Web y Dispositivo</button>
        <button *ngIf="numero_usuario !='NA'" class="btn btn-danger btn-block btn-sm" (click)="clickEliminarFotoWebDispositivo()"><i class="fas fa-trash"></i> Eliminar Foto Web y Dispositivo</button>
        <button class="btn btn-primary btn-block btn-sm" (click)="closeCamera();" type="button" data-dismiss="modal"><i class="fas fa-times-circle"></i> Cerrar</button>
       </div>


    </div>

  </div>
</div>

<div id="mymodaltomarfoto" class="modal fade" role="dialog" data-backdrop="false">
  <div class="modal-dialog">
    <div class="modal-content">
<div class="modal-header">
      <h5 class="modal-title">SOCIO: {{ cliente }}</h5>
        <button type="button" class="close" data-dismiss="modal" aria-label="Close" (click)="closeCamera();">
          <span aria-hidden="true">×</span>
         </button>
      </div>

      <div class="modal-body">
        <video class="img-fluid" autoplay playsinline></video>
      </div>

       <div class="modal-footer">
        <button *ngIf="emparejareditar==false" class="btn btn-primary btn-block btn-sm mr-1" (click)="capturePhoto()"><i class="fas fa-camera"></i> Capturar Foto</button>
        <button *ngIf="numero_usuario !='NA' && emparejareditar==true" class="btn btn-warning btn-block btn-sm mr-1" (click)="captureActualizarPhoto()"><i class="fas fa-camera"></i> Capturar foto para actualizar</button>
        <button class="btn btn-primary btn-block btn-sm mr-1" (click)="closeCamera();" type="button" data-dismiss="modal"><i class="fas fa-times-circle"></i> Cerrar</button>
       </div>


    </div>

  </div>
</div>
