<app-registro-abono-venta [importetotal] = "facturaventa.importetotal" (sendAceptar)="sendAceptar($event)"></app-registro-abono-venta>

<app-cliente-form (datosenvio)="recibirDatosNuevoCliente($event)"></app-cliente-form>

<app-listado-cliente-venta (datosenviar)="recibirDatosCliente($event)"></app-listado-cliente-venta>

<div id="mymodallistarproductos" class="modal fade" role="dialog" style="overflow-y: scroll; scrollbar-width: none;" data-backdrop="false">
  <div class="modal-dialog modal-xl">
    <!-- Modal content mw-100 w-75-->
    <div class="modal-content">
      <div class="modal-header">
      <h5 class="modal-title">LISTADO DE PLANES</h5>
    <button type="button" class="close" data-dismiss="modal" aria-label="Close">
          <span aria-hidden="true">×</span>
          </button>
      </div>
      <div class="modal-body">
          <app-listado-planes-gym (datosenviar)="recibirDatosProducto($event)"></app-listado-planes-gym>

          <div class="d-flex justify-content-end align-items-center">
            <button (click)="actualizarListadoProducto();" type="button" class="btn btn-primary btn-sm" data-dismiss="modal"><i class="fas fa-sync-alt"></i> Actualizar</button>&nbsp;
            <button class="btn btn-secondary btn-sm" type="button" data-dismiss="modal"><i class="fas fa-times-circle"></i> Cerrar</button>
          </div>
      </div>

    </div>

  </div>
</div>

<app-listado-apertura-diario></app-listado-apertura-diario>

<app-listado-socios (datosenviar)="recibirDatosSocio($event)"></app-listado-socios>

<section class="content-header" id="box">
  <div class="container-fluid">
    <div class="row mb-2">
      <div class="col-sm-6">
          <div class="btn-toolbar" role="toolbar">
            <div class="btn-group">
              <button *ngIf="tipo_formulario=='nuevoregistrodiario'" (click)="clickNuevo();" [disabled]="disabledbtnnuevo" class="btn btn-primary btn-flat btn-sm" type="button"><i class="fas fa-file"></i> Nuevo</button>
                <button *ngIf="tipo_formulario=='actualizarregistro'" (click)="clickModificar();" [disabled]="disabledbtnmodificar" class="btn btn-primary btn-flat btn-sm" type="button"><i class="fas fa-edit"></i> Modificar</button>
                <button (click)="visualizar(0);" [disabled]="disabledbtnimprimir" class="btn btn-primary btn-flat btn-sm" type="button"><i class="fas fa-print"></i> Imprimir</button>
                <button *ngIf="tipo_formulario=='nuevoregistrodiario'" (click)="clickAbrirPuerta();" class="btn btn-primary btn-flat btn-sm" type="button"><i class="fas fa-door-open"></i> Abrir Puerta</button>
                <button (click)="goBack();" class="btn btn-secondary btn-flat btn-sm" type="button"><i class="fa fa-reply"></i> Atrás</button>
            </div>

          </div>


      </div>


      <div class="col-sm-6">

        <div>
          <div class="input-group input-group-sm">
            <div *ngIf="multisucursal=='1'" class="input-group-prepend">
              <span class="input-group-text"><i class="fas fa-home"></i></span>
            </div>
            <label *ngIf="multisucursal=='1'" class="form-control">{{sucursal_estable}}</label>

            <div *ngIf="firmasruc=='1'" class="input-group-prepend">
              <span class="input-group-text"><i class="fas fa-signature"></i></span>
            </div>
            <select *ngIf="tipo_formulario!='actualizarregistro' && firmasruc=='1'" (change)="changeEmpresa($event)" class="btn btn-primary btn-flat btn-sm flex-grow-1">
              <option value="{{item.cod_ruc}}" *ngFor="let item of datosrucempresa" [selected]="this.rucempresa.cod_ruc == item.cod_ruc">
                  {{item.empresa}}
              </option>
            </select>
            <label *ngIf="tipo_formulario=='actualizarregistro' && firmasruc=='1'" class="form-control">{{this.rucempresa.empresa}}</label>
              <div *ngIf="tipo_formulario!='actualizarregistro' && firmasruc=='1' && rucusuario =='1'" class="input-group-prepend">
                <app-configurar-firma-venta (datosenvio)="recibirDatosFirmaVenta($event)"></app-configurar-firma-venta>
              </div>

          </div>
      </div>
      </div>
      

      
    </div>
    
  </div><!-- /.container-fluid -->

  
</section>

<!-- Main content -->
<section class="content">
  <div class="container-fluid">
    

    <div class="row">

      <div class="col-md-3">
        <div class="form-group">
          <div class="input-group input-group-sm">
              <div class="input-group-prepend">
                <span class="input-group-text"><i class="fas fa-paperclip"></i>&nbsp;Nº Factura:</span>
              </div>
              <label *ngIf="numeracion_automatica == '1'" class="form-control">{{this.facturaventa.numero_factura}}</label>
              <label *ngIf="numeracion_automatica == '0' && facturaventa.tipo_venta != 'FACTURA'" class="form-control">{{this.facturaventa.numero_factura}}</label>
              <input *ngIf="numeracion_automatica == '0' && facturaventa.tipo_venta == 'FACTURA'" [(ngModel)]="this.facturaventa.numero_factura" [disabled]="disabledtxtnfactura" class="form-control"/>
          </div>
        </div>
      </div>
      
      <div class="col-md-3">
        <div class="form-group">
          <div class="input-group input-group-sm">
              <div class="input-group-prepend">
              <span class="input-group-text"><i class="fas fa-calendar"></i>&nbsp;Fecha:</span>
              </div>
              <input (change)="changeFecha();" [(ngModel)]="facturaventa.fecha_registro" class="form-control" [disabled]="disabledtxtfecha" type="date">
          </div>
        </div>
      </div>

      <div class="col-md-6">

        <div class="form-group">
          <div class="input-group input-group-sm">
              <div class="input-group-prepend">
              <span class="input-group-text"><i class="fas fa-key"></i>&nbsp;Clave:</span>
              </div>
              <label class="form-control form-control-sm" style="height: auto;">{{this.facturaventa.claveacceso}}</label>
          </div>
        </div>

      </div>
      

    </div>

    <div *ngIf="tipo_formulario=='nuevoregistro' || (tipo_formulario=='actualizarregistro' && cod_tipo_plan == 1)" class="row">
      <div class="col-md-12">
        <div class="card card-cyan card-outline">
          <div class="pl-3 pt-3 pr-3">
            <div [ngClass]="chkgrupal ? '' : 'd-none'" class="justify-content-center text-right">
              <button type="button" class="btn btn-primary btn-flat btn-xs" (click)="clickListarSocios();"> <span class="fa fa-plus"></span> Agregar</button>
            </div>
            <h6 class="text-primary">
                  <span class="pr-3" *ngFor="let item of socios; let i = index">
                    <i class="fa fa-user"></i>&nbsp;<label>{{ item.nombres_completos }}</label>
                    <button (click)="borrar(i);" type="button" class="btn btn-outline-danger btn-sm ml-3 mr-3"> <span class="fa fa-trash"></span> </button>
                  </span>
            </h6>
          </div>
        </div>
    </div>

    
      
    </div>

      <div class="row">

        

        <div class="col-md-8">

                <div class="card card-cyan card-outline">
                    <div class="card-header">

                      <div style="text-align:center">
                        <div *ngIf="loading" class="spinner-border text-primary" style="width: 3rem; height: 3rem;"></div>
                      </div>

                        <!-- <button *ngIf="tipo_formulario=='nuevoregistrodiario' || tipo_formulario=='actualizarregistrodiario' || (tipo_formulario=='actualizarregistro' && cod_tipo_plan == 0)" (click)="clickListarCliente();" [disabled]="disabledbtnlistarcliente" type="button" class="btn btn-primary btn-flat btn-xs float-right"> <span class="fa fa-list"></span> </button>
                        <button *ngIf="tipo_formulario=='nuevoregistrodiario' || tipo_formulario=='actualizarregistrodiario' || (tipo_formulario=='actualizarregistro' && cod_tipo_plan == 0)" (click)="clickNuevoCliente();" [disabled]="disabledbtnagregarcliente" type="button" class="btn btn-primary btn-flat btn-xs float-right"> <span class="fa fa-plus"></span> </button> -->

                        <button (click)="clickListarCliente();" [disabled]="disabledbtnlistarcliente" type="button" class="btn btn-primary btn-flat btn-xs float-right"> <span class="fa fa-list"></span> </button>
                        <button (click)="clickNuevoCliente();" [disabled]="disabledbtnagregarcliente" type="button" class="btn btn-primary btn-flat btn-xs float-right"> <span class="fa fa-plus"></span> </button>

                        <h5 style="font-size: 14px">
                                <i class="fa fa-user-circle" aria-hidden="true"></i>&nbsp;<label>{{ this.cliente.cliente }}</label>
                                &nbsp;&nbsp;&nbsp;
                                <i class="fa fa-id-card" aria-hidden="true"></i>&nbsp;<label>{{ this.cliente.numero_identificacion }}</label><label *ngIf="this.flagtextoafiliar">&nbsp;&nbsp;&nbsp;<span class="badge badge-primary">Cliente afiliado</span></label><br>
                                <i class="fas fa-mobile" aria-hidden="true"></i>&nbsp;
                                <label id="lblcelular">{{ this.cliente.celular }}</label>
                                &nbsp;&nbsp;&nbsp;
                                <i class="fa fa-envelope" aria-hidden="true"></i>&nbsp;<label>{{ this.cliente.correo }}</label>
                        </h5>

                    </div>
                    <div *ngIf="this.flagbotonafiliar" class="modal-footer">
                        <button *ngIf="this.cantidad_compras>=4" (click)="this.afiliarCliente();" type="button" class="btn btn-warning btn-flat btn-sm">
                          <span class="badge badge-light">{{this.cantidad_compras}} compras</span> Afiliar cliente
                        </button>

                        <label *ngIf="this.cantidad_compras<4" class="badge badge-primary">{{this.cantidad_compras}} Compras</label>
                    </div>
                    
                </div>

                <div *ngIf="facturaventa.infomembresia">
                  <div class="alert alert-warning alert-dismissible">
                  <button type="button" class="close" data-dismiss="alert" aria-hidden="true">×</button>
                  <h5><i class="icon fas fa-exclamation-triangle"></i> Informacion de membresia!</h5>
                  El usuario cliente ya consta de una membresia <label>{{ this.facturaventa.infoestadoplan }}</label>, antes de registrar una membresia debe verificar su registro, pueda ser que se registró y no se percató.
                  <br>
                  PLAN ACTIVO: <label>{{ this.facturaventa.infoplan }}</label><br>
                  FECHA INICIO: <label>{{ this.facturaventa.infofechainicio }}</label><br>
                  FECHA FIN: <label>{{ facturaventa.infofechafin }}</label>
                  </div>
              </div>

                <div *ngIf="tipo_formulario=='nuevoregistro' || (tipo_formulario=='actualizarregistro') || tipo_formulario=='nuevoregistrodiario'" class="form-group">
                  <!-- <label>Código Barra:</label>                     -->
                  <div class="input-group input-group-sm">
                      <div class="input-group-prepend">
                          <span class="input-group-text"><i class="fas fa-barcode"></i></span>
                          <!-- <span class="input-group-text"><input (change)="changeChkImpuesto();" [checked]="chkimpuesto" [disabled]="disabledchkimpuesto" type="checkbox">IMP.</span> -->
                      </div>
                      <input #txtcodigobarra [(ngModel)]="codigo_barra" oninput="javascript:this.value=this.value.toUpperCase();" (keyup.enter)="buscarCodigoProducto();" class="form-control" maxlength="35" [disabled]="disabledtxtcodigobarra" placeholder="Ingrese Código de Barra"type="text">
                      <span class="input-group-append">
                          <button (click)="clickListarProductos();" [disabled]="disabledbtnlistarproducto" class="btn btn-primary btn-flat" type="button"><i class="fa fa-list"></i></button>
                      </span>
                  </div>
                </div>
            
                <div *ngIf="tipo_formulario=='nuevoregistro' || (tipo_formulario=='actualizarregistro' && cod_tipo_plan == 1)" class="row">
                  <div class="col-md-6">
                      <div class="form-group">
                          <label>Fecha Inicio:</label>
                          <div class="input-group input-group-sm">
                              <div class="input-group-prepend">
                              <span class="input-group-text"><i class="fas fa-calendar"></i></span>
                              </div>
                              <input [ngClass]="{'is-invalid': flagcalcularfecha}" [(ngModel)]="facturaventa.fecha_inicio_plan" (change)="changeFechaInicioPlan($event)" type="date" class="form-control">
                          </div>
                      </div>
                  </div>

                  <div *ngIf="tipo_formulario=='nuevoregistro' || (tipo_formulario=='actualizarregistro' && cod_tipo_plan == 1)" class="col-md-6">
                      <div class="form-group">
                          <label>Fecha Fin:</label>
                          <div class="input-group input-group-sm">
                              <div class="input-group-prepend">
                              <span class="input-group-text"><i class="fas fa-calendar"></i></span>
                              </div>
                              <label class="form-control">{{ facturaventa.fecha_fin_plan }}</label>
                          </div>
                      </div>
                  </div>
              </div>

              <div *ngIf="tipo_formulario=='nuevoregistro' || (tipo_formulario=='actualizarregistro' && cod_tipo_plan == 1)" class="row">
                  <div class="col-md-12">
                      <div class="form-group">
                          <label>Horario:</label>
                          <div class="input-group input-group-sm">
                              <div class="input-group-prepend">
                              <span class="input-group-text"><i class="fas fa-calendar"></i></span>
                              </div>
                              <label class="form-control">{{ facturaventa.horario }}</label>
                          </div>
                      </div>
                  </div>
              </div>

                <app-detalle-venta [datosproducto] = "this.datosproducto" [datostarifasproducto] = "this.datostarifasproducto" (datosenviar)="recibirDatosDetalles($event)"></app-detalle-venta>
                
        </div>

        <div class="col-md-4">

            <div class="card card-cyan card-outline">
                <div class="card-header">
                    <h1><i class="fa fa-money-bill-alt"></i><label class="text-primary float-right">{{this.facturaventa.importetotal}}</label></h1>
                    <div *ngIf="textomensaje != ''" style='text-align: center;'>
                          <label style='font-size:30px;' [ngStyle]="{'color':colormensaje}">{{textomensaje}}</label>
                    </div>
                </div>
                <div class="card-body">
                        <div class="row">			 
                            <div class="col-md-12" style="font-size: 14px">

                                    <div class="form-group row">
                                        <label class="col-sm-4 col-form-label">Documento:</label>
                                        <div class="col-sm-8">
                                            <div class="input-group input-group-sm">
                                                <div class="input-group-prepend">
                                                    <span class="input-group-text"><i class="fas fa-shopping-cart"></i></span>
                                                </div>
                                                <select [disabled]="disabledcmbtipoventa" (change)="changeTipoVenta($event)" class="form-control form-control-sm">
                                                  <option value="{{item.cod_tipo_venta}}" *ngFor="let item of datostipoventa" [selected]="item.tipo_venta == this.facturaventa.tipo_venta">
                                                      {{item.tipo_venta}}
                                                  </option>
                                              </select>
                                            </div>
                                        </div>
                                    </div>

                                <app-recargo-factura [loading] = "loading" [disabledcmbrecargo] = "disabledcmbrecargo" (sendChangeRecargo)="sendChangeRecargo($event)" (sendChangeTarjetaTarifa)="sendChangeTarjetaTarifa($event)"></app-recargo-factura>

                                <app-forma-pago [disabledformapago] = "disabledformapago" [chkcontado] = "chkcontado" (sendChangeFormaPago)="sendChangeFormaPago()"></app-forma-pago>

                                <div [ngClass]="{'d-none': ocultartransaccionesbanco}">
                                  <app-transacciones-banco [disabledtransaccionbanco] = "disabledtransaccionbanco"></app-transacciones-banco>
                                </div>

                                <div *ngIf="this.comision_venta == '1'" class="form-group row">
                                  <label for="inputEmail3" class="col-sm-4 col-form-label">Vendedor:</label>
                                  <div class="col-sm-8">
                                      
                                          <select [disabled]="disabledcmbempleado"  [ngClass]="{'is-invalid': flagempleado}" (change)="changeEmpleado($event)" class="form-control form-control-sm">
                                              <option value="0">SELECCIONE UN VENDEDOR</option>
                                              <option value="{{item.cod_empleado}}" *ngFor="let item of datosempleados" [selected]="item.cod_empleado == this.facturaventa.cod_empleado">
                                                  {{item.apellido + " " + item.nombre}}
                                              </option>
                                          </select>
                                  </div>
                               </div>
                               
                              <div class="form-group">
                                <div class="custom-control custom-switch custom-switch-off-secondary custom-switch-on-success">
                                <input (change)="changeChkContado();" [checked]="chkcontado" [disabled]="disabledchkcontado" type="checkbox" class="custom-control-input" id="customSwitch3">
                                <label class="custom-control-label" for="customSwitch3">Venta al Contado</label>
                                </div>
                                </div>

                                <app-compensacion [disabledformapago] = "disabledformapago" [chkcontado] = "chkcontado"></app-compensacion>
                                
                                <button *ngIf="facturaventa.deudor==1 && (tipo_formulario=='nuevoregistro' || this.tipo_formulario == 'copiarregistro' || this.tipo_formulario == 'finalizarpedidoreservado')" (click)="clickAbonar()" class="btn btn-primary btn-block btn-sm" type="button"><i class="fas fa-hand-holding-usd"></i>
                                  Abonar
                                  <span class="badge badge-success">
                                    {{ this.facturaventa.recibidoabono }}
                                  </span>
                                </button>

                                <button (click)="clickCambio()" [disabled]="disabledbtncalcular" class="btn btn-success btn-block btn-sm" type="button"><i class="fas fa-money-bill-alt"></i> Recibido</button>

                                <button *ngIf="tipo_formulario=='nuevoregistro' || tipo_formulario=='nuevoregistrodiario'" (click)="clickVerificar();" [disabled]="disabledbtnguardar" class="btn btn-primary btn-block btn-sm" type="button"><i class="fas fa-save"></i>
                                  Guardar
                                  <span *ngIf="facturaventa.deudor==1" class="badge badge-warning">
                                    Por Cobrar
                                  </span>
                                </button>

                                <div *ngIf="tipo_formulario=='actualizarregistro'" class="pt-2">
                                  <button (click)="clickVerificar();" [disabled]="disabledbtnactualizar" class="btn btn-warning btn-block btn-sm" type="button"><i class="fas fa-save"></i> Actualizar</button>
                                </div>
                                
                                <!-- <div class="pt-2">
                                  <button (click)="iniciarProcesoFacturacion()" *ngIf="electronico == '1'" [disabled]="disabledbtnsrienviar" class="btn btn-success btn-block btn-sm" type="button"><i class="fas fa-paper-plane"></i> Enviar SRI</button>
                                </div> -->
                            </div>
                        </div>

                </div>
                
            </div>


            

            

            



        </div>
      </div>		


     

  
      


    


  </div>
</section>
