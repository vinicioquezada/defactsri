<app-cliente-form (datosenvio)="recibirDatosNuevoCliente($event)"></app-cliente-form>

<app-listado-cliente (datosenviar)="recibirDatosCliente($event)"></app-listado-cliente>

  <section class="content-header">
    <div class="container-fluid">
      <div class="row mb-2">
        <div class="col-sm-12">
            <div class="btn-toolbar" role="toolbar">
              <div class="btn-group">
              
                <button (click)="clickDeshacer();" class="btn btn-secondary btn-flat btn-sm float-right" type="button"><i class="fas fa-redo-alt"></i> Deshacer</button>
                <button routerLink="/menuhotel/exploradordepartamentos" class="btn btn-secondary btn-flat btn-sm" type="button"><i class="fas fa-undo"></i> Atrás</button>
              </div>
            </div>
        </div>
        
      </div>
      
    </div><!-- /.container-fluid -->
  </section>
  
  <!-- Main content -->
<section class="content">
    <div class="container-fluid">
      <div class="row">
  
        <div class="col-md-12">

          <div class="row">

            <div class="col-md-5">
                <!-- /.Inicia form1 -->
                <!-- /.Inicia form1 -->
                <!-- /.Inicia form1 -->
                <div class="card card-primary card-outline">
                    <div class="card-header">
                    <h3 class="card-title"><i class="fa fa-file-alt"></i> {{this.titulo}}</h3>
                    </div>

                    <div class="card-body">
                        
                        <div class="row">
                            <div class="col-md-12">
                                
                                <div class="form-group">
                                    <label>Cedula:</label>  
                                    <div class="input-group input-group-sm">
                                        <input [(ngModel)]="numero_identificacion1" type="text" class="form-control form-control-sm">
                                        <span class="input-group-append">
                                            <button (click)="clickNuevoCliente();" type="button" class="btn btn-primary btn-flat btn-xs"> <span class="fa fa-plus"></span> </button>
                                            <button (click)="clickListarCliente();" type="button" class="btn btn-info btn-flat btn-xs"> <span class="fa fa-list"></span> </button>
                                        </span>
                                    </div>
                                </div>
                          
                                <div class="form-group">
                                    <label>Persona:</label>  
                                    <input [(ngModel)]="cliente1" type="text" class="form-control form-control-sm">
                                </div>

                                <div class="form-group">
                                    <label>Celular:</label>  
                                    <input [(ngModel)]="celular1" type="text" class="form-control form-control-sm">     
                                </div>
                                
                                
                                <div class="col-md-12">

                                    <div class="row">
                                      <p>
                                        <a class="btn btn-secondary btn-flat btn-sm" data-toggle="collapse" href="#collapseExample1" role="button" aria-expanded="false" aria-controls="collapseExample"><i class="fa fa-user"></i>
                                          Persona 2
                                        </a>
                                      </p>
                                    </div>

                                    <div class="collapse" id="collapseExample1">
                                        <div class="card card-body">
                                            <div class="col-md-12">
                        
                                                <div class="form-group">
                                                    <label>Cedula:</label>  
                                                    <div class="input-group input-group-sm">
                                                        <input [(ngModel)]="numero_identificacion2" type="text" class="form-control form-control-sm">
                                                        <span class="input-group-append">
                                                            <button (click)="clickNuevoCliente2();" type="button" class="btn btn-primary btn-flat btn-xs"> <span class="fa fa-plus"></span> </button>
                                                            <button (click)="clickListarCliente2();" type="button" class="btn btn-info btn-flat btn-xs"> <span class="fa fa-list"></span> </button>
                                                        </span>
                                                    </div>
                                                </div>	 
                                          
                                                <div class="form-group">
                                                    <label>Persona:</label>  
                                                    <input [(ngModel)]="cliente2" type="text" class="form-control form-control-sm">
                                                </div>
                
                                                <div class="form-group">
                                                    <label>Celular:</label>  
                                                    <input [(ngModel)]="celular2" type="text" class="form-control form-control-sm">     
                                                </div>                        
                        
                                            </div>
                                            <div class="modal-footer">
                                                <button (click)="deshacerPersona2();" type="button" class="btn btn-secondary"><i class="fa fa-redo-alt"></i> Deshacer</button>
                                            </div>
                                        </div>
                                    </div>

                                    <div class="row">
                                        <p>
                                          <a class="btn btn-secondary btn-flat btn-sm" data-toggle="collapse" href="#collapseExample2" role="button" aria-expanded="false" aria-controls="collapseExample"><i class="fa fa-user"></i>
                                            Persona 3
                                          </a>
                                        </p>
                                    </div>

                                    <div class="collapse" id="collapseExample2">
                                    <div class="card card-body">
                                        <div class="col-md-12">
                    
                                            <div class="form-group">
                                                <label>Cedula:</label>  
                                                <div class="input-group input-group-sm">
                                                    <input [(ngModel)]="numero_identificacion3" type="text" class="form-control form-control-sm">
                                                    <span class="input-group-append">
                                                        <button (click)="clickNuevoCliente3();" type="button" class="btn btn-primary btn-flat btn-xs"> <span class="fa fa-plus"></span> </button>
                                                        <button (click)="clickListarCliente3();" type="button" class="btn btn-info btn-flat btn-xs"> <span class="fa fa-list"></span> </button>
                                                    </span>
                                                </div>
                                            </div>	 
                                        
                                            <div class="form-group">
                                                <label>Persona:</label>  
                                                <input [(ngModel)]="cliente3" type="text" class="form-control form-control-sm">
                                            </div>
            
                                            <div class="form-group">
                                                <label>Celular:</label>  
                                                <input [(ngModel)]="celular3" type="text" class="form-control form-control-sm">     
                                            </div>                        
                    
                                        </div>
                                        <div class="modal-footer">
                                            <button (click)="deshacerPersona3();" type="button" class="btn btn-secondary"><i class="fa fa-redo-alt"></i> Deshacer</button>
                                        </div>
                                    </div>
                                    </div>

                                <div>
                                      
                                     


                                      


                                    </div>
                                </div>

                                <div class="form-group">
                                    <label>Observación:</label>  
                                    <textarea [(ngModel)]="observacion" class="form-control"></textarea> 
                                </div>

                            
                                <div class="form-group">
                                    <label>Fecha Inicio:</label>
                                    <div class="input-group input-group-sm">
                                    <div class="input-group-prepend">
                                        <span class="input-group-text"><i class="fas fa-calendar"></i></span>
                                    </div>
                                    <input [ngClass]="{'is-invalid': flagfechaingreso}" [(ngModel)]="fecha_ingreso" type="date" class="form-control">
                                    <input [ngClass]="{'is-invalid': flaghorainicioreserva}" [(ngModel)]="hora_inicio_reserva" type="time" class="form-control">
                                    </div>
                                </div>

                                <div class="form-group">
                                    <label>Hora Ingreso:</label>
                                    <div class="input-group input-group-sm">
                                    <div class="input-group-prepend">
                                        <span class="input-group-text"><i class="fas fa-clock"></i></span>
                                    </div>
                                    <input [ngClass]="{'is-invalid': flaghoraingreso}" [(ngModel)]="hora_ingreso" type="time" class="form-control">
                                    </div>
                                </div>

                                
                            
                                <div class="form-group">
                                        <label>Fecha Fin Reserva:</label>
                                        <div class="input-group input-group-sm">
                                            <div class="input-group-prepend">
                                                <span class="input-group-text"><i class="fas fa-calendar"></i></span>
                                            </div>
                                            <input (change)="changeFechaFinReserva();" [ngClass]="{'is-invalid': flagfechafinreserva}" [(ngModel)]="fecha_fin_reserva" type="date" class="form-control">
                                        </div>
                                </div>

                                <div class="form-group">
                                    <label>Fecha Salida Habitación:</label>
                                    <div class="input-group input-group-sm">
                                        <div class="input-group-prepend">
                                            <span class="input-group-text"><i class="fas fa-calendar"></i></span>
                                        </div>
                                        <!-- <label class="form-control">{{fecha_salida}}</label> -->
                                        <input [ngClass]="{'is-invalid': flagfechafinreserva}" [(ngModel)]="fecha_salida" type="date" class="form-control">
                                        <input [ngClass]="{'is-invalid': flaghorafinreserva}" [(ngModel)]="hora_fin_reserva" type="time" class="form-control">
                                    </div>
                                </div>

                            </div>
                         
                        </div>
                    </div>

                    <!-- /.card-body -->

                    <div class="row justify-content-between">
                        <span class="h5 justify-content-center text-center m-auto text-primary">{{tiemporestante}}</span>
                    </div>

                    <div class="modal-footer d-flex justify-content-between align-items-center">
                        <button [ngClass]="{'d-none': flagocultarboton}" (click)="clickGuardar();" type="button" class="btn btn-primary"><i class="fas fa-save"></i> Guardar</button>
                        <button  [ngClass]="{'d-none': !flagocultarboton}" (click)="clickActualizar();" type="button" class="btn btn-warning"><i class="fas fa-save"></i> Actualizar</button>
                        <button [ngClass]="{'d-none': !flagocultarboton}" (click)="clickAnular();" type="button" class="btn btn-danger"><i class="fas fa-trash-alt"></i> Anular</button>
                    </div>
                </div>
                <!-- /.Termina form1 -->
                <!-- /.Termina form1 -->
                <!-- /.Termina form1 -->
            </div>

            <div class="col-md-7">
                    <!-- /.Inicia form1 -->
                    <!-- /.Inicia form1 -->
                    <!-- /.Inicia form1 -->
                    <div class="card card-primary card-outline">
                        <div class="card-header">
                        <h3 class="card-title"><i class="fa fa-file-alt"></i> Horario de Reservas</h3>
                        </div>

                        <div class="card-body overlay-wrapper">

                            <div *ngIf="loadinglistado" class="overlay overlay-custom d-flex flex-column align-items-center">
                              <div class="spinner-border text-primary" style="width: 5rem; height: 5rem; font-size: 30px;" role="status"></div>
                              <div class="text-bold pt-2">Cargando...</div>
                            </div>

                            <div class="row justify-content-between">
                                    
                            
                                <div class="col-md-12">
                                    <full-calendar [options]='calendarOptions'></full-calendar>
                                </div>

                            </div>
                        </div>
                        <!-- /.card-body -->
                    </div>
                    <!-- /.Termina form1 -->
                    <!-- /.Termina form1 -->
                    <!-- /.Termina form1 -->
            </div>

           </div>



        </div>
  
      </div>
  
  
  
      
  
  
  
    </div>
  </section>
